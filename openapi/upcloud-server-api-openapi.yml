  schemas:
    serverRfc3339Datetime:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: string
      examples:
      - '2026-07-01T00:00:00Z'
      - '2026-07-31T23:59:59Z'
      format: date-time
      description: Datetime in RFC 3339 format
    serverTitle:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: string
      description: Cloud Server title
      example: My Server
    server:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        server:
          $ref: '#/components/schemas/serverDetails'
      required:
      - server
      additionalProperties: false
      description: Cloud Server object returned in responses
      example:
        server:
          boot_order: disk
          core_number: '12'
          created: 1705320000
          firewall: 'on'
          host: 7653311107
          hostname: server1.example.com
          labels:
            label:
            - key: env
              value: development
          license: '0'
          memory_amount: '130048'
          nic_model: virtio
          plan: GPU-12xCPU-128GB-2xL40S
          plan_ipv4_bytes: '3565675343'
          plan_ipv6_bytes: '4534432'
          remote_access_enabled: 'yes'
          remote_access_type: vnc
          server_group: 0b3d85b4-b3be-46ca-a1e2-3b5d40d60fb1
          simple_backup: 0100,dailies
          state: started
          storage_devices:
            storage_device:
            - address: virtio:0
              boot_disk: '1'
              labels: []
              storage: 012580a1-32a1-466e-a323-689ca16f2d43
              storage_encrypted: 'yes'
              storage_size: 20
              storage_title: Operating system disk
              type: disk
          tags:
            tag:
            - DEV
            - Ubuntu
          timezone: UTC
          title: Development GPU server
          uuid: 0077fa3d-32db-4b09-9f5f-30d9e9afb565
          video_model: cirrus
          zone: fi-hel1
    serverStorageDevicesResponse:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        storage_device:
          type: array
          items:
            type: object
            properties:
              address:
                type: string
                description: Device address on the Cloud Server.
              boot_disk:
                type: string
                enum:
                - '0'
                - '1'
                description: Whether this device is the Cloud Server's boot disk, encoded as 0 or 1.
              labels:
                type: array
                items:
                  $ref: '#/components/schemas/serverLabel'
                description: Labels assigned to the storage resource.
              part_of_plan:
                $ref: '#/components/schemas/serverBooleanYesno'
              storage:
                type: string
                description: Storage resource UUID. Empty for an unloaded CD-ROM device.
              storage_encrypted:
                $ref: '#/components/schemas/serverBooleanYesno'
              storage_size:
                type: integer
                description: Storage resource size in gibibytes.
              storage_tier:
                type: string
                description: Storage resource performance tier.
              storage_title:
                type: string
                description: Storage resource title.
              type:
                type: string
                enum:
                - disk
                - cdrom
                description: Attached device type.
            required:
            - address
            - boot_disk
            - labels
            - storage
            - storage_encrypted
            - storage_size
            - storage_title
            - type
            additionalProperties: false
      required:
      - storage_device
      additionalProperties: false
      description: Storage devices attached to a Cloud Server
      example:
        storage_device:
        - address: virtio:0
          boot_disk: '1'
          labels: []
          storage: 012580a1-32a1-466e-a323-689ca16f2d43
          storage_encrypted: 'yes'
          storage_size: 20
          storage_title: Operating system disk
          type: disk
    serverNetworkType:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: string
      enum:
      - public
      - utility
      - private
      description: Network access type
      example: public
    serverModifyInterface:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        interface:
          type: object
          properties:
            bootable:
              $ref: '#/components/schemas/serverBooleanYesno'
            index:
              type: integer
              maximum: 255
              minimum: 1
              format: int32
              description: New index for the interface; defaults to the index in the request path
            ip_addresses:
              type: object
              properties:
                ip_address:
                  type: array
                  items:
                    type: object
                    properties:
                      address:
                        $ref: '#/components/schemas/serverIpAddress'
                      dhcp_provided:
                        $ref: '#/components/schemas/serverBooleanYesno'
                      family:
                        $ref: '#/components/schemas/serverIpFamily'
                    required:
                    - family
              required:
              - ip_address
              description: Complete replacement list of IP addresses for the interface
            source_ip_filtering:
              $ref: '#/components/schemas/serverBooleanYesno'
          minProperties: 1
          additionalProperties: false
      required:
      - interface
      additionalProperties: false
      description: Modify network interface request
      example:
        interface:
          bootable: 'yes'
          index: 5
          source_ip_filtering: 'no'
    serverReason:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: string
      maxLength: 200
      minLength: 1
      description: Schema for reason strings used in API payloads.
    serverTags:
      $schema: https://json-schema.org/draft/2020-12/schema
      anyOf:
      - type: array
        items:
          type: string
      - type: object
        properties:
          tag:
            type: array
            items:
              type: string
        required:
        - tag
        additionalProperties: false
      description: tags can be an empty array or an object with a tag array
      example:
        tag: []
    serverFirewallRulesetRelationshipInternal:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        applied_version:
          type:
          - integer
          - 'null'
        created_at:
          type: integer
        firewall_ruleset_uuid:
          $ref: '#/components/schemas/serverUuid'
        last_applied_at:
          type:
          - integer
          - 'null'
        server_uuid:
          $ref: '#/components/schemas/serverUuid'
        type:
          type: string
          enum:
          - public
          - private
        updated_at:
          type:
          - integer
          - 'null'
        version:
          type: integer
      required:
      - server_uuid
      - firewall_ruleset_uuid
      - type
      - version
      - created_at
      - updated_at
      - last_applied_at
      - applied_version
      additionalProperties: false
      description: Firewall ruleset relationship with Unix timestamps.
    serverVncHost:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: string
      description: VNC host IP address or noVNC proxy hostname. Empty when no VNC endpoint is assigned.
      example: 94.237.1.20
    serverError:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        error:
          type: object
          properties:
            error_code:
              type: string
              examples:
              - GENERAL_FAILURE
            error_message:
              type: string
              examples:
              - Your request could not be fulfilled due to a technical issue.
          required:
          - error_code
          - error_message
          additionalProperties: false
      required:
      - error
      additionalProperties: false
      description: A general error response indicating that the request could not be fulfilled due to a technical issue.
    serverNetworkStatsSummary:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        variable:
          type: array
          items:
            type: object
            properties:
              average:
                type: string
                description: Average bit rate or packet rate during the period.
              current:
                type: string
                description: Most recent bit rate or packet rate.
              title:
                type: string
                enum:
                - In
                - Out
              maximum:
                type: string
                description: Maximum bit rate or packet rate during the period.
              total:
                type: string
                description: Total transferred data or packets during the period.
            required:
            - average
            - current
            - title
            - maximum
            - total
            additionalProperties: false
      required:
      - variable
      additionalProperties: false
      description: Summarized inbound and outbound network statistics values.
      example:
        variable:
        - average: 12 Mbps
          current: 8.5 Mbps
          maximum: 24 Mbps
          title: In
          total: 8.0 GiB
    serverZone:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: string
      examples:
      - fi-hel1
      - de-fra1
      - us-nyc1
      maxLength: 15
      minLength: 2
      pattern: ^[a-z][a-z0-9-]{0,14}[a-z0-9]$
      description: Zone identifier
    serverCpuStats:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        stats:
          type: object
          properties:
            daily:
              type: object
              properties:
                summary:
                  $ref: '#/components/schemas/serverCpuStatsSummary'
              required:
              - summary
            monthly:
              type: object
              properties:
                summary:
                  $ref: '#/components/schemas/serverCpuStatsSummary'
              required:
              - summary
            yearly:
              type: object
              properties:
                summary:
                  $ref: '#/components/schemas/serverCpuStatsSummary'
              required:
              - summary
            weekly:
              type: object
              properties:
                summary:
                  $ref: '#/components/schemas/serverCpuStatsSummary'
              required:
              - summary
          minProperties: 1
          additionalProperties: false
      required:
      - stats
      additionalProperties: false
      description: CPU usage statistics grouped by period
      example:
        stats:
          daily:
            summary:
              variable:
              - average: 12 %
                current: 8 %
                maximum: 37 %
                title: CPU usage %
                total: 51 seconds
    serverCreateDevices:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        device:
          type: array
          items:
            type: object
            properties:
              serial:
                type: string
                description: Serial identifier of the attached device
              type:
                type: string
                description: Type of passthrough device to attach
            required:
            - serial
            - type
            additionalProperties: false
      required:
      - device
      additionalProperties: false
      description: Passthrough devices requested for a new Cloud Server
      example:
        device:
        - serial: '1723925007011'
          type: gpu
    serverInterfaceResponse:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        interface:
