      - 1xCPU-1GB
      - DEV-1xCPU-4GB
      - CLOUDNATIVE-1xCPU-8GB
      - GPU-12xCPU-128GB-2xL40S
      maxLength: 255
      minLength: 1
      description: Server plan identifier
    serverFirewallRuleResponseItem:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        action:
          type: string
          enum:
          - accept
          - drop
          description: Action taken when the rule matches.
        comment:
          type: string
          description: Free-form rule description.
        destination_address_end:
          type: string
          description: Last destination IP address in the matched range, or an empty string when unrestricted.
        destination_address_start:
          type: string
          description: First destination IP address in the matched range, or an empty string when unrestricted.
        destination_port_end:
          type: string
          description: Last destination port in the matched range, or an empty string when unrestricted.
        destination_port_start:
          type: string
          description: First destination port in the matched range, or an empty string when unrestricted.
        direction:
          type: string
          enum:
          - in
          - out
          description: Traffic direction to which the rule applies.
        family:
          type: string
          enum:
          - IPv4
          - IPv6
          - ''
          description: IP address family, or an empty string when unrestricted.
        icmp_type:
          type: string
          description: ICMP packet type, or an empty string when unrestricted.
        position:
          type: string
          pattern: ^(?:[1-9]|[1-9][0-9]{1,2}|1000)$
          description: One-based position in the Cloud Server's firewall rule chain.
        protocol:
          type: string
          enum:
          - tcp
          - udp
          - icmp
          - ''
          description: Matched network protocol, or an empty string when unrestricted.
        source_address_end:
          type: string
          description: Last source IP address in the matched range, or an empty string when unrestricted.
        source_address_start:
          type: string
          description: First source IP address in the matched range, or an empty string when unrestricted.
        source_port_end:
          type: string
          description: Last source port in the matched range, or an empty string when unrestricted.
        source_port_start:
          type: string
          description: First source port in the matched range, or an empty string when unrestricted.
      required:
      - action
      - comment
      - destination_address_end
      - destination_address_start
      - destination_port_end
      - destination_port_start
      - direction
      - family
      - icmp_type
      - position
      - protocol
      - source_address_end
      - source_address_start
      - source_port_end
      - source_port_start
      additionalProperties: false
      description: A firewall rule with its position in the Cloud Server's rule chain.
    serverPasswordDelivery:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: string
      description: Password delivery method
      example: email
    serverCoreNumber:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: integer
      format: int32
      description: Number of CPU cores
      example: 2
    serverServerGroup:
      $schema: https://json-schema.org/draft/2020-12/schema
      type:
      - string
      - 'null'
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      description: UUID of the server group containing the Cloud Server, or null when the Cloud Server is not in a group.
      example: 0b3d85b4-b3be-46ca-a1e2-3b5d40d60fb1
    serverLoginUser:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      not:
        properties:
          create_password:
            const: 'yes'
        required:
