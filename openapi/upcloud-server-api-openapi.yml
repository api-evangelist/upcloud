          bootable: 'no'
          index: 4
          ip_addresses:
            ip_address:
            - address: 10.0.0.20
              dhcp_provided: 'yes'
              family: IPv4
              floating: 'no'
              release_policy: release
          mac: de:ff:ff:ff:cc:20
          network: 0374ce47-4303-4490-987d-32dc96cfd79b
          source_ip_filtering: 'yes'
          type: private
    serverPlanName:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: string
