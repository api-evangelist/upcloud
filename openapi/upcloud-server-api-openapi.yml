        - ssh_keys
      properties:
        create_password:
          $ref: '#/components/schemas/serverBooleanYesno'
        ssh_keys:
          type: object
          properties:
            ssh_key:
              type: array
              items:
                type: string
                description: Public SSH key in OpenSSH authorized_keys format. Invalid keys are rejected
              maxItems: 32
              minItems: 1
          required:
          - ssh_key
          additionalProperties: false
        username:
          type: string
          description: Username for logging in to the Cloud Server
      additionalProperties: false
      description: Login user configuration for Cloud Server creation
      example:
        username: upclouduser
    serverIpAddressInterfaceResponse:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
