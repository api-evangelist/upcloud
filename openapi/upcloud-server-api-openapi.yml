openapi: 3.2.0
info:
  title: Upcloud Server API
  version: '1.3'
  contact:
    name: UpCloud
    url: https://upcloud.com
    email: hello@upcloud.com
  license:
    name: MIT
    url: https://spdx.org/licenses/MIT.html
  termsOfService: https://upcloud.com/terms-of-service/
  description: 'Operations tagged server across 2 of this provider''s published API definitions: upcloud-openapi.json, upcloud-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.upcloud.com
security:
- apiToken: []
tags:
- name: Server
  description: Manages Cloud Servers
  x-displayName: Server
paths:
  /1.3/server:
    get:
      tags:
      - Server
      summary: List Cloud Servers
      description: Returns the most relevant information for Cloud Servers associated with the current account.
      operationId: listServers
      parameters:
      - $ref: '#/components/parameters/listServersLabel'
      - $ref: '#/components/parameters/listServersUuid'
      - $ref: '#/components/parameters/listServersHost'
      - $ref: '#/components/parameters/listServersDevice'
      - $ref: '#/components/parameters/listServersState'
      - $ref: '#/components/parameters/listServersTag'
      - $ref: '#/components/parameters/listServersSearch'
      - $ref: '#/components/parameters/listServersSortBy'
      - $ref: '#/components/parameters/listServersOrderBy'
      - $ref: '#/components/parameters/listServersLimit'
      - $ref: '#/components/parameters/listServersOffset'
      responses:
        '200':
          $ref: '#/components/responses/listServers200'
        '400':
          $ref: '#/components/responses/listServers400'
        '403':
          $ref: '#/components/responses/listServers403'
        '404':
          $ref: '#/components/responses/listServers404'
        '409':
          $ref: '#/components/responses/listServers409'
        default:
          $ref: '#/components/responses/listServersDefault'
      x-upcloud-visibility: public
    post:
      tags:
      - Server
      summary: Create a new Cloud Server
      description: Creates a new Cloud Server
      operationId: createServer
      requestBody:
        $ref: '#/components/requestBodies/createServer'
      responses:
        '202':
          $ref: '#/components/responses/createServer202'
        '400':
          $ref: '#/components/responses/createServer400'
        '403':
          $ref: '#/components/responses/createServer403'
        '404':
          $ref: '#/components/responses/createServer404'
        '409':
          $ref: '#/components/responses/createServer409'
        default:
          $ref: '#/components/responses/createServerDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/server/firewall_ruleset_relationships/private/{ruleset_uuid}:
    get:
      tags:
      - Server
      summary: List Cloud Servers related to a private firewall ruleset
      description: Return Cloud Servers visible to the authenticated account that are related to a private firewall ruleset, including each Cloud Server's private ruleset relationships.
      operationId: listFirewallRulesetRelationships
      parameters:
      - $ref: '#/components/parameters/serverListFirewallRulesetRelationshipsRulesetUuid'
      responses:
        '200':
          $ref: '#/components/responses/serverListFirewallRulesetRelationships200'
        '400':
          $ref: '#/components/responses/serverListFirewallRulesetRelationships400'
        default:
          $ref: '#/components/responses/serverListFirewallRulesetRelationshipsDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/server/labels:
    get:
      tags:
      - Server
      summary: List Cloud Server labels
      description: Returns the unique label key-value pairs used by Cloud Servers accessible to the current account.
      operationId: getLabels
      responses:
        '200':
          $ref: '#/components/responses/serverGetLabels200'
        default:
          $ref: '#/components/responses/serverGetLabelsDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/server/{uuid}:
    get:
      tags:
      - Server
      summary: Get Cloud Server details
      description: Returns detailed information about a Cloud Server.
      operationId: getServer
      parameters:
      - $ref: '#/components/parameters/getServerUuid'
      responses:
        '200':
          $ref: '#/components/responses/getServer200'
        '400':
          $ref: '#/components/responses/getServer400'
        '403':
          $ref: '#/components/responses/getServer403'
        '404':
          $ref: '#/components/responses/getServer404'
        default:
          $ref: '#/components/responses/getServerDefault'
      x-upcloud-visibility: public
    put:
      tags:
      - Server
      summary: Modify an existing Cloud Server
      description: Modifies an existing Cloud Server configuration.
      operationId: modifyServer
      parameters:
      - $ref: '#/components/parameters/modifyServerUuid'
      requestBody:
        $ref: '#/components/requestBodies/modifyServer'
      responses:
        '202':
          $ref: '#/components/responses/modifyServer202'
        '400':
          $ref: '#/components/responses/modifyServer400'
        '403':
          $ref: '#/components/responses/modifyServer403'
        '404':
          $ref: '#/components/responses/modifyServer404'
        '409':
          $ref: '#/components/responses/modifyServer409'
        default:
          $ref: '#/components/responses/modifyServerDefault'
      x-upcloud-visibility: public
    delete:
      tags:
      - Server
      summary: Delete a Cloud Server
      description: Deletes a stopped Cloud Server and releases its IP addresses. Deleting backups requires deleting the associated storage devices.
      operationId: deleteServer
      parameters:
      - $ref: '#/components/parameters/deleteServerUuid'
      - $ref: '#/components/parameters/deleteServerStorages'
      - $ref: '#/components/parameters/deleteServerBackups'
      responses:
        '204':
          $ref: '#/components/responses/deleteServer204'
        '400':
          $ref: '#/components/responses/deleteServer400'
        '403':
          $ref: '#/components/responses/deleteServer403'
        '404':
          $ref: '#/components/responses/deleteServer404'
        '409':
          $ref: '#/components/responses/deleteServer409'
        default:
          $ref: '#/components/responses/deleteServerDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/server/{uuid}/attach_firewall_ruleset/private:
    post:
      tags:
      - Server
      summary: Attach a private firewall ruleset
      description: Attach a private, stateful firewall ruleset to a Cloud Server. The latest ruleset version is selected and applied to private network interfaces.
      operationId: attachPrivateFirewallRuleset
      parameters:
      - $ref: '#/components/parameters/serverAttachPrivateFirewallRulesetUuid'
      requestBody:
        $ref: '#/components/requestBodies/serverAttachPrivateFirewallRuleset'
      responses:
        '200':
          $ref: '#/components/responses/serverAttachPrivateFirewallRuleset200'
        '400':
          $ref: '#/components/responses/serverAttachPrivateFirewallRuleset400'
        '403':
          $ref: '#/components/responses/serverAttachPrivateFirewallRuleset403'
        '404':
          $ref: '#/components/responses/serverAttachPrivateFirewallRuleset404'
        '409':
          $ref: '#/components/responses/serverAttachPrivateFirewallRuleset409'
        default:
          $ref: '#/components/responses/serverAttachPrivateFirewallRulesetDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/server/{uuid}/cancel:
    post:
      tags:
      - Server
      summary: Cancel a Cloud Server operation
      description: Cancels an operation while the Cloud Server is in maintenance state.
      operationId: cancelServerOperation
      parameters:
      - $ref: '#/components/parameters/cancelServerOperationUuid'
      responses:
        '204':
          $ref: '#/components/responses/cancelServerOperation204'
        '400':
          $ref: '#/components/responses/cancelServerOperation400'
        '403':
          $ref: '#/components/responses/cancelServerOperation403'
        '404':
          $ref: '#/components/responses/cancelServerOperation404'
        '409':
          $ref: '#/components/responses/cancelServerOperation409'
        default:
          $ref: '#/components/responses/cancelServerOperationDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/server/{uuid}/cdrom/eject:
    post:
      tags:
      - Server
      summary: Eject the CD-ROM image from a Cloud Server
      description: Eject the storage from the Cloud Server's attached CD-ROM device.
      operationId: ejectCDROM
      parameters:
      - $ref: '#/components/parameters/serverEjectCDROMUuid'
      responses:
        '200':
          $ref: '#/components/responses/serverEjectCDROM200'
        '400':
          $ref: '#/components/responses/serverEjectCDROM400'
        '403':
          $ref: '#/components/responses/serverEjectCDROM403'
        '404':
          $ref: '#/components/responses/serverEjectCDROM404'
        '409':
          $ref: '#/components/responses/serverEjectCDROM409'
        '511':
          $ref: '#/components/responses/serverEjectCDROM511'
        default:
          $ref: '#/components/responses/serverEjectCDROMDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/server/{uuid}/cdrom/load:
    post:
      tags:
      - Server
      summary: Load a CD-ROM image into a Cloud Server
      description: Load a storage of type normal or cdrom into the Cloud Server's attached CD-ROM device. If media is already loaded, it is ejected first.
      operationId: loadCDROM
      parameters:
      - $ref: '#/components/parameters/serverLoadCDROMUuid'
      requestBody:
        $ref: '#/components/requestBodies/serverLoadCDROM'
      responses:
        '200':
          $ref: '#/components/responses/serverLoadCDROM200'
        '400':
          $ref: '#/components/responses/serverLoadCDROM400'
        '403':
          $ref: '#/components/responses/serverLoadCDROM403'
        '404':
          $ref: '#/components/responses/serverLoadCDROM404'
        '409':
          $ref: '#/components/responses/serverLoadCDROM409'
        '511':
          $ref: '#/components/responses/serverLoadCDROM511'
        default:
          $ref: '#/components/responses/serverLoadCDROMDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/server/{uuid}/detach_firewall_ruleset/private:
    post:
      tags:
      - Server
      summary: Detach a private firewall ruleset
      description: Detach a private firewall ruleset from a Cloud Server and reapply private-interface firewall rules.
      operationId: detachPrivateFirewallRuleset
      parameters:
      - $ref: '#/components/parameters/serverDetachPrivateFirewallRulesetUuid'
      requestBody:
        $ref: '#/components/requestBodies/serverDetachPrivateFirewallRuleset'
      responses:
        '200':
          $ref: '#/components/responses/serverDetachPrivateFirewallRuleset200'
        '400':
          $ref: '#/components/responses/serverDetachPrivateFirewallRuleset400'
        '403':
          $ref: '#/components/responses/serverDetachPrivateFirewallRuleset403'
        '404':
          $ref: '#/components/responses/serverDetachPrivateFirewallRuleset404'
        '409':
          $ref: '#/components/responses/serverDetachPrivateFirewallRuleset409'
        default:
          $ref: '#/components/responses/serverDetachPrivateFirewallRulesetDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/server/{uuid}/firewall_rule:
    get:
      tags:
      - Server
      summary: List firewall rules
      description: Return the Cloud Server firewall rules in evaluation order. Changes to firewall rules can take 1-2 minutes to take effect.
      operationId: listFirewallRules
      parameters:
      - $ref: '#/components/parameters/serverListFirewallRulesUuid'
      responses:
        '200':
          $ref: '#/components/responses/serverListFirewallRules200'
        '400':
          $ref: '#/components/responses/serverListFirewallRules400'
        '403':
          $ref: '#/components/responses/serverListFirewallRules403'
        '404':
          $ref: '#/components/responses/serverListFirewallRules404'
        default:
          $ref: '#/components/responses/serverListFirewallRulesDefault'
      x-upcloud-visibility: public
    put:
      tags:
      - Server
      summary: Replace firewall rules
      description: Replace the Cloud Server's complete firewall rule chain. Array order determines rule positions. Changes can take 1-2 minutes to take effect.
      operationId: updateFirewallRules
      parameters:
      - $ref: '#/components/parameters/serverUpdateFirewallRulesUuid'
      requestBody:
        $ref: '#/components/requestBodies/serverUpdateFirewallRules'
      responses:
        '204':
          $ref: '#/components/responses/serverUpdateFirewallRules204'
        '400':
          $ref: '#/components/responses/serverUpdateFirewallRules400'
        '403':
          $ref: '#/components/responses/serverUpdateFirewallRules403'
        '404':
          $ref: '#/components/responses/serverUpdateFirewallRules404'
        '409':
          $ref: '#/components/responses/serverUpdateFirewallRules409'
        default:
          $ref: '#/components/responses/serverUpdateFirewallRulesDefault'
      x-upcloud-visibility: public
    post:
      tags:
      - Server
      summary: Create a firewall rule
      description: Create a firewall rule. Rules are evaluated in position order; if position is omitted, the rule is appended. Changes can take 1-2 minutes to take effect.
      operationId: createFirewallRule
      parameters:
      - $ref: '#/components/parameters/serverCreateFirewallRuleUuid'
      requestBody:
        $ref: '#/components/requestBodies/serverCreateFirewallRule'
      responses:
        '201':
          $ref: '#/components/responses/serverCreateFirewallRule201'
        '400':
          $ref: '#/components/responses/serverCreateFirewallRule400'
        '403':
          $ref: '#/components/responses/serverCreateFirewallRule403'
        '404':
          $ref: '#/components/responses/serverCreateFirewallRule404'
        '409':
          $ref: '#/components/responses/serverCreateFirewallRule409'
        default:
          $ref: '#/components/responses/serverCreateFirewallRuleDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/server/{uuid}/firewall_rule/{position}:
    get:
      tags:
      - Server
      summary: Get a firewall rule
      description: Return the firewall rule at the specified one-based position in the Cloud Server rule chain.
      operationId: getFirewallRule
      parameters:
      - $ref: '#/components/parameters/serverGetFirewallRuleUuid'
      - $ref: '#/components/parameters/serverGetFirewallRulePosition'
      responses:
        '200':
          $ref: '#/components/responses/serverGetFirewallRule200'
        '400':
          $ref: '#/components/responses/serverGetFirewallRule400'
        '403':
          $ref: '#/components/responses/serverGetFirewallRule403'
        '404':
          $ref: '#/components/responses/serverGetFirewallRule404'
        default:
          $ref: '#/components/responses/serverGetFirewallRuleDefault'
      x-upcloud-visibility: public
    delete:
      tags:
      - Server
      summary: Delete a firewall rule
      description: Delete the firewall rule at the specified one-based position. Remaining rules are renumbered. Changes can take 1-2 minutes to take effect.
      operationId: deleteFirewallRule
      parameters:
      - $ref: '#/components/parameters/serverDeleteFirewallRuleUuid'
      - $ref: '#/components/parameters/serverDeleteFirewallRulePosition'
      responses:
        '204':
          $ref: '#/components/responses/serverDeleteFirewallRule204'
        '400':
          $ref: '#/components/responses/serverDeleteFirewallRule400'
        '403':
          $ref: '#/components/responses/serverDeleteFirewallRule403'
        '404':
          $ref: '#/components/responses/serverDeleteFirewallRule404'
        '409':
          $ref: '#/components/responses/serverDeleteFirewallRule409'
        default:
          $ref: '#/components/responses/serverDeleteFirewallRuleDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/server/{uuid}/firewall_ruleset_relationships/private:
    get:
      tags:
      - Server
      summary: List private firewall ruleset relationships for a Cloud Server
      description: Return all private firewall ruleset relationships configured for a Cloud Server.
      operationId: listPrivateFirewallRulesetRelationships
      parameters:
      - $ref: '#/components/parameters/serverListPrivateFirewallRulesetRelationshipsUuid'
      responses:
        '200':
          $ref: '#/components/responses/serverListPrivateFirewallRulesetRelationships200'
        '400':
          $ref: '#/components/responses/serverListPrivateFirewallRulesetRelationships400'
        '403':
          $ref: '#/components/responses/serverListPrivateFirewallRulesetRelationships403'
        '404':
          $ref: '#/components/responses/serverListPrivateFirewallRulesetRelationships404'
        default:
          $ref: '#/components/responses/serverListPrivateFirewallRulesetRelationshipsDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/server/{uuid}/gpus:
    get:
      tags:
      - Server
      summary: List Cloud Server GPUs
      description: Returns GPUs attached to a Cloud Server.
      operationId: listServerGPUs
      parameters:
      - $ref: '#/components/parameters/listServerGPUsUuid'
      responses:
        '200':
          $ref: '#/components/responses/listServerGPUs200'
        '400':
          $ref: '#/components/responses/listServerGPUs400'
        '403':
          $ref: '#/components/responses/listServerGPUs403'
        '404':
          $ref: '#/components/responses/listServerGPUs404'
        default:
          $ref: '#/components/responses/listServerGPUsDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/server/{uuid}/networking:
    get:
      tags:
      - Server
      summary: Get Cloud Server networking details
      description: Return all network interfaces and IP addresses configured for a Cloud Server.
      operationId: getServerNetworking
      parameters:
      - $ref: '#/components/parameters/getServerNetworkingUuid'
      responses:
        '200':
          $ref: '#/components/responses/getServerNetworking200'
        '400':
          $ref: '#/components/responses/getServerNetworking400'
        '403':
          $ref: '#/components/responses/getServerNetworking403'
        '404':
          $ref: '#/components/responses/getServerNetworking404'
        default:
          $ref: '#/components/responses/getServerNetworkingDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/server/{uuid}/networking/interface:
    post:
      tags:
      - Server
      summary: Add a network interface
      description: Add a network interface to a stopped Cloud Server. A private interface must identify the SDN network to attach. The combined limit of network interfaces and storage devices is 24.
      operationId: addServerInterface
      parameters:
      - $ref: '#/components/parameters/addServerInterfaceUuid'
      requestBody:
        $ref: '#/components/requestBodies/addServerInterface'
      responses:
        '201':
          $ref: '#/components/responses/addServerInterface201'
        '400':
          $ref: '#/components/responses/addServerInterface400'
        '403':
          $ref: '#/components/responses/addServerInterface403'
        '404':
          $ref: '#/components/responses/addServerInterface404'
        '409':
          $ref: '#/components/responses/addServerInterface409'
        default:
          $ref: '#/components/responses/addServerInterfaceDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/server/{uuid}/networking/interface/{index}:
    put:
      tags:
      - Server
      summary: Modify a network interface
      description: Modify the IP addresses, source IP filtering, boot setting, or index of a network interface on a stopped Cloud Server. Changing the interface network or type is not supported.
      operationId: modifyServerInterface
      parameters:
      - $ref: '#/components/parameters/modifyServerInterfaceUuid'
      - $ref: '#/components/parameters/modifyServerInterfaceIndex'
      requestBody:
        $ref: '#/components/requestBodies/modifyServerInterface'
      responses:
        '200':
          $ref: '#/components/responses/modifyServerInterface200'
        '400':
          $ref: '#/components/responses/modifyServerInterface400'
        '403':
          $ref: '#/components/responses/modifyServerInterface403'
        '404':
          $ref: '#/components/responses/modifyServerInterface404'
        '409':
          $ref: '#/components/responses/modifyServerInterface409'
        default:
          $ref: '#/components/responses/modifyServerInterfaceDefault'
      x-upcloud-visibility: public
    delete:
      tags:
      - Server
      summary: Delete a network interface
      description: Delete a network interface from a stopped Cloud Server. IP addresses attached to the interface are released according to their release policies.
      operationId: deleteServerInterface
      parameters:
      - $ref: '#/components/parameters/deleteServerInterfaceUuid'
      - $ref: '#/components/parameters/deleteServerInterfaceIndex'
      responses:
        '204':
          $ref: '#/components/responses/deleteServerInterface204'
        '400':
          $ref: '#/components/responses/deleteServerInterface400'
        '403':
          $ref: '#/components/responses/deleteServerInterface403'
        '404':
          $ref: '#/components/responses/deleteServerInterface404'
        '409':
          $ref: '#/components/responses/deleteServerInterface409'
        default:
          $ref: '#/components/responses/deleteServerInterfaceDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/server/{uuid}/networking/interface/{index}/ip_address:
    post:
      tags:
      - Server
      summary: Add an IP address to a network interface
      description: Add an IPv4 or IPv6 address to a private network interface. The interface cannot contain addresses from both families and can have at most five addresses.
      operationId: addServerInterfaceIpAddress
      parameters:
      - $ref: '#/components/parameters/addServerInterfaceIpAddressUuid'
      - $ref: '#/components/parameters/addServerInterfaceIpAddressIndex'
      - $ref: '#/components/parameters/addServerInterfaceIpAddressForce'
      requestBody:
        $ref: '#/components/requestBodies/addServerInterfaceIpAddress'
      responses:
        '201':
          $ref: '#/components/responses/addServerInterfaceIpAddress201'
        '400':
          $ref: '#/components/responses/addServerInterfaceIpAddress400'
        '403':
          $ref: '#/components/responses/addServerInterfaceIpAddress403'
        '404':
          $ref: '#/components/responses/addServerInterfaceIpAddress404'
        '409':
          $ref: '#/components/responses/addServerInterfaceIpAddress409'
        default:
          $ref: '#/components/responses/addServerInterfaceIpAddressDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/server/{uuid}/networking/interface/{index}/ip_address/{ip}:
    delete:
      tags:
      - Server
      summary: Delete an IP address from a network interface
      description: Delete an IP address from a private network interface. At least one IP address must remain attached to the interface.
      operationId: deleteServerInterfaceIpAddress
      parameters:
      - $ref: '#/components/parameters/deleteServerInterfaceIpAddressUuid'
      - $ref: '#/components/parameters/deleteServerInterfaceIpAddressIndex'
      - $ref: '#/components/parameters/deleteServerInterfaceIpAddressIp'
      responses:
        '204':
          $ref: '#/components/responses/deleteServerInterfaceIpAddress204'
        '400':
          $ref: '#/components/responses/deleteServerInterfaceIpAddress400'
        '403':
          $ref: '#/components/responses/deleteServerInterfaceIpAddress403'
        '404':
          $ref: '#/components/responses/deleteServerInterfaceIpAddress404'
        '409':
          $ref: '#/components/responses/deleteServerInterfaceIpAddress409'
        default:
          $ref: '#/components/responses/deleteServerInterfaceIpAddressDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/server/{uuid}/rebuild:
    post:
      tags:
      - Server
      summary: Rebuild a Cloud Server
      description: Reinstalls a stopped Cloud Server from a public template.
      operationId: rebuildServer
      parameters:
      - $ref: '#/components/parameters/rebuildServerUuid'
      requestBody:
        $ref: '#/components/requestBodies/rebuildServer'
      responses:
        '202':
          $ref: '#/components/responses/rebuildServer202'
        '400':
          $ref: '#/components/responses/rebuildServer400'
        '403':
          $ref: '#/components/responses/rebuildServer403'
        '404':
          $ref: '#/components/responses/rebuildServer404'
        '409':
          $ref: '#/components/responses/rebuildServer409'
        default:
          $ref: '#/components/responses/rebuildServerDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/server/{uuid}/relocate:
    post:
      tags:
      - Server
      summary: Relocate a Cloud Server to another zone
      description: Relocates a stopped Cloud Server to another zone in the same physical location (datacenter).
      operationId: relocateServer
      parameters:
      - $ref: '#/components/parameters/relocateServerUuid'
      requestBody:
        $ref: '#/components/requestBodies/relocateServer'
      responses:
        '200':
          $ref: '#/components/responses/relocateServer200'
        '400':
          $ref: '#/components/responses/relocateServer400'
        '403':
          $ref: '#/components/responses/relocateServer403'
        '404':
          $ref: '#/components/responses/relocateServer404'
        '409':
          $ref: '#/components/responses/relocateServer409'
        default:
