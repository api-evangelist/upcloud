          address: 10.0.0.30
          dhcp_provided: 'no'
          family: IPv4
    serverEncodedHostId:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: integer
      examples:
      - 7653311107
      minimum: 1
      format: int64
      description: Encoded Private Cloud host ID
    serverSimpleBackup:
      $schema: https://json-schema.org/draft/2020-12/schema
      type:
      - string
      - 'null'
      examples:
      - 0100,dailies
      - 'no'
      description: Simple backup start time in UTC and frequency, separated by a comma, or no to disable
    serverCreateFirewallRule:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        firewall_rule:
          type: object
          allOf:
          - $ref: '#/components/schemas/serverFirewallRuleRequirements'
          properties:
            action:
              type: string
              enum:
              - accept
              - drop
              description: Action taken when the rule matches.
            comment:
              type: string
              maxLength: 250
              description: Free-form rule description.
            destination_address_end:
              type: string
              description: Last destination IP address in the range. Must be specified with destination_address_start.
            destination_address_start:
              type: string
              description: First destination IP address in the range. Must be specified with destination_address_end.
            destination_port_end:
              $ref: '#/components/schemas/serverFirewallRulePort'
            destination_port_start:
              $ref: '#/components/schemas/serverFirewallRulePort'
            direction:
              type: string
              enum:
              - in
              - out
              description: Traffic direction to which the rule applies.
            family:
              type: string
              enum:
              - IPv4
              - IPv6
              description: IP address family. Required when protocol, addresses, ports, or ICMP type are specified.
            icmp_type:
              $ref: '#/components/schemas/serverFirewallRuleIcmpType'
            position:
              type: string
              pattern: ^(?:[1-9]|[1-9][0-9]{1,2}|1000)$
              description: Position at which to insert the rule. Rules at and after this position are shifted down. If omitted or greater than the current rule count, the rule is appended.
            protocol:
              type: string
              enum:
              - tcp
              - udp
              - icmp
              description: Network protocol to match.
            source_address_end:
              type: string
              description: Last source IP address in the range. Must be specified with source_address_start.
            source_address_start:
              type: string
              description: First source IP address in the range. Must be specified with source_address_end.
            source_port_end:
              $ref: '#/components/schemas/serverFirewallRulePort'
            source_port_start:
              $ref: '#/components/schemas/serverFirewallRulePort'
          required:
          - action
          - direction
          additionalProperties: false
      required:
      - firewall_rule
      additionalProperties: false
      description: Parameters for creating a firewall rule.
      example:
        firewall_rule:
          action: accept
          comment: Allow SSH from the office network
          destination_port_end: '22'
          destination_port_start: '22'
          direction: in
          family: IPv4
          position: '1'
          protocol: tcp
          source_address_end: 192.0.2.255
          source_address_start: 192.0.2.1
    serverBooleanYesno:
      $schema: https://json-schema.org/draft/2020-12/schema
