    serverAttachStorage:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        storage_device:
          type: object
          allOf:
          - {}
          properties:
            address:
              type: string
              pattern: ^(?:ide(?::[01]:[01])?|scsi(?::0:(?:[0-9]|1[0-5]))?|virtio(?::(?:[0-9]|1[0-5]))?)$
              description: Device address or bus. When only a bus is specified, the next available address on that bus is selected. Defaults to the next available virtio address for disks and IDE address for CD-ROM devices.
            boot_disk:
              allOf:
              - $ref: '#/components/schemas/serverBoolean01'
              description: Whether to use this storage device as the boot disk. The Cloud Server boot_order setting takes precedence.
              default: 0
            storage:
              $ref: '#/components/schemas/serverUuid'
            type:
              type: string
              enum:
              - disk
              - cdrom
              description: Type of device to attach.
              default: disk
          additionalProperties: false
          description: Storage device to attach.
