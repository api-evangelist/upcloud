      - storage_device
      additionalProperties: false
      description: Parameters for attaching a storage device to a Cloud Server.
      example:
        storage_device:
          address: virtio:0
          boot_disk: 1
          storage: 012580a1-32a1-466e-a323-689ca16f2d43
          type: disk
