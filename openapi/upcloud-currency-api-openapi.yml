openapi: 3.2.0
info:
  title: Upcloud Currency API
  version: '1.3'
  contact:
    name: UpCloud
    url: https://upcloud.com
    email: hello@upcloud.com
  license:
    name: MIT
    url: https://spdx.org/licenses/MIT.html
  termsOfService: https://upcloud.com/terms-of-service/
  description: 'Operations tagged currency across 2 of this provider''s published API definitions: upcloud-openapi.json, upcloud-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.upcloud.com
security:
- apiToken: []
tags:
- name: Currency
  description: Currency management
  x-displayName: Currency
paths:
  /1.3/currency:
    get:
      tags:
      - Currency
      summary: List currencies
      description: Retrieves a list of supported currencies and their exchange rates relative to the account credit currency.
      operationId: listCurrencies
      responses:
        '200':
          $ref: '#/components/responses/currencyListCurrencies200'
        default:
          $ref: '#/components/responses/currencyListCurrenciesDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
components:
  responses:
    currencyListCurrenciesDefault:
      description: General failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/currencyError'
    currencyListCurrencies200:
      description: A list of currencies with their exchange rates.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/currencyCurrencies'
  schemas:
    currencyCode:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: string
      pattern: ^[A-Z]{3}$
      description: ISO 4217 code
    currencyCurrencies:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        currencies:
          type: object
          properties:
            currency:
              type: array
              items:
                type: object
                properties:
                  code:
                    $ref: '#/components/schemas/currencyCode'
                  rate:
                    type: number
                    examples:
                    - 0.01
                    format: double
                  updated:
                    type: string
                    examples:
                    - '2017-12-15T06:44:47Z'
                    format: date-time
                required:
                - code
                - rate
                - updated
                example:
                  code: USD
                  rate: 0.01
                  updated: '2017-12-15T06:44:47Z'
              additionalProperties: false
              description: List of supported currency rate entries.
          required:
          - currency
          additionalProperties: false
          description: Wrapped collection of currency rate entries.
          example:
            currency:
            - code: EUR
              rate: 0.00846077
              updated: '2017-12-14T10:00:00Z'
            - code: GBP
              rate: 0.00743236
              updated: '2017-12-14T10:00:00Z'
      required:
      - currencies
      additionalProperties: false
      description: Response schema for listing supported currencies and exchange rates.
      example:
        currencies:
          currency:
          - code: EUR
            rate: 0.00846077
            updated: '2017-12-14T10:00:00Z'
          - code: GBP
            rate: 0.00743236
            updated: '2017-12-14T10:00:00Z'
          - code: SGD
            rate: 0.01347685
            updated: '2017-12-14T10:00:00Z'
          - code: USD
            rate: 0.01
            updated: '2017-12-15T06:44:47Z'
    currencyError:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        error:
          type: object
          properties:
            error_code:
              type: string
              examples:
              - GENERAL_FAILURE
            error_message:
              type: string
              examples:
              - Your request could not be fulfilled due to a technical issue.
          required:
          - error_code
          - error_message
          additionalProperties: false
      required:
      - error
      additionalProperties: false
      description: A general error response indicating that the request could not be fulfilled due to a technical issue.
  securitySchemes:
    apiToken:
      type: http
      description: UpCloud API uses HTTP Bearer authentication. An API token is required to authenticate. The API token can be created in the UpCloud control panel. Alternatively, you can create an API token using the API directly, or with upctl. Note that if you want to use HTTP Basic authentication on API or with upctl, you will need to enable API access in the UpCloud control panel first.
      scheme: bearer
