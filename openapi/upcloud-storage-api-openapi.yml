openapi: 3.2.0
info:
  title: Upcloud Storage API
  version: '1.3'
  contact:
    name: UpCloud
    url: https://upcloud.com
    email: hello@upcloud.com
  license:
    name: MIT
    url: https://spdx.org/licenses/MIT.html
  termsOfService: https://upcloud.com/terms-of-service/
  description: 'Operations tagged storage across 2 of this provider''s published API definitions: upcloud-openapi.json, upcloud-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.upcloud.com
security:
- apiToken: []
tags:
- name: Storage
  description: Block Storage is similar to a physical hard disk.
  x-displayName: Block Storage
paths:
  /1.3/storage:
    get:
      tags:
      - Storage
      summary: List storage resources
      description: Returns all storage resources accessible to the account. The results can be filtered by labels or a title and UUID search, sorted, and paginated.
      operationId: getStorageList
      parameters:
      - $ref: '#/components/parameters/getStorageListLabel'
      - $ref: '#/components/parameters/getStorageListSearch'
      - $ref: '#/components/parameters/getStorageListSortBy'
      - $ref: '#/components/parameters/getStorageListOrderBy'
      - $ref: '#/components/parameters/getStorageListLimit'
      - $ref: '#/components/parameters/getStorageListOffset'
      responses:
        '200':
          $ref: '#/components/responses/getStorageList200'
        '400':
          $ref: '#/components/responses/getStorageList400'
        default:
          $ref: '#/components/responses/getStorageListDefault'
      x-upcloud-visibility: public
    post:
      tags:
      - Storage
      summary: Create Block Storage
      description: Creates a block storage resource in a specific zone. The new block storage is not attached to a Cloud Server.
      operationId: createStorage
      requestBody:
        $ref: '#/components/requestBodies/createStorage'
      responses:
        '201':
          $ref: '#/components/responses/createStorage201'
        default:
          $ref: '#/components/responses/createStorageDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/storage/backup:
    get:
      tags:
      - Storage
      summary: List storage backups
      description: Returns accessible storage resources whose type is `backup`.
      operationId: getStorageListByBackup
      parameters:
      - $ref: '#/components/parameters/getStorageListByBackupLabel'
      - $ref: '#/components/parameters/getStorageListByBackupSearch'
      - $ref: '#/components/parameters/getStorageListByBackupSortBy'
      - $ref: '#/components/parameters/getStorageListByBackupOrderBy'
      - $ref: '#/components/parameters/getStorageListByBackupLimit'
      - $ref: '#/components/parameters/getStorageListByBackupOffset'
      responses:
        '200':
          $ref: '#/components/responses/getStorageListByBackup200'
        '400':
          $ref: '#/components/responses/getStorageListByBackup400'
        default:
          $ref: '#/components/responses/getStorageListByBackupDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/storage/cdrom:
    get:
      tags:
      - Storage
      summary: List CD-ROM images
      description: Returns accessible storage resources whose type is `cdrom`.
      operationId: getStorageListByCdrom
      parameters:
      - $ref: '#/components/parameters/getStorageListByCdromLabel'
      - $ref: '#/components/parameters/getStorageListByCdromSearch'
      - $ref: '#/components/parameters/getStorageListByCdromSortBy'
      - $ref: '#/components/parameters/getStorageListByCdromOrderBy'
      - $ref: '#/components/parameters/getStorageListByCdromLimit'
      - $ref: '#/components/parameters/getStorageListByCdromOffset'
      responses:
        '200':
          $ref: '#/components/responses/getStorageListByCdrom200'
        '400':
          $ref: '#/components/responses/getStorageListByCdrom400'
        default:
          $ref: '#/components/responses/getStorageListByCdromDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/storage/favorite:
    get:
      tags:
      - Storage
      summary: List favorite storage resources
      description: Returns the public templates and CD-ROM images that the account has marked as favorites.
      operationId: getFavoriteStorageList
      responses:
        '200':
          $ref: '#/components/responses/getFavoriteStorageList200'
        default:
          $ref: '#/components/responses/getFavoriteStorageListDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/storage/normal:
    get:
      tags:
      - Storage
      summary: List normal Block Storage
      description: Returns accessible Block Storage resources whose type is `normal`.
      operationId: getStorageListByNormal
      parameters:
      - $ref: '#/components/parameters/getStorageListByNormalLabel'
      - $ref: '#/components/parameters/getStorageListByNormalSearch'
      - $ref: '#/components/parameters/getStorageListByNormalSortBy'
      - $ref: '#/components/parameters/getStorageListByNormalOrderBy'
      - $ref: '#/components/parameters/getStorageListByNormalLimit'
      - $ref: '#/components/parameters/getStorageListByNormalOffset'
      responses:
        '200':
          $ref: '#/components/responses/getStorageListByNormal200'
        '400':
          $ref: '#/components/responses/getStorageListByNormal400'
        default:
          $ref: '#/components/responses/getStorageListByNormalDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/storage/private:
    get:
      tags:
      - Storage
      summary: List private storage resources
      description: Returns accessible storage resources whose access type is `private`.
      operationId: getStorageListByPrivateAccess
      parameters:
      - $ref: '#/components/parameters/getStorageListByPrivateAccessLabel'
      - $ref: '#/components/parameters/getStorageListByPrivateAccessSearch'
      - $ref: '#/components/parameters/getStorageListByPrivateAccessSortBy'
      - $ref: '#/components/parameters/getStorageListByPrivateAccessOrderBy'
      - $ref: '#/components/parameters/getStorageListByPrivateAccessLimit'
      - $ref: '#/components/parameters/getStorageListByPrivateAccessOffset'
      responses:
        '200':
          $ref: '#/components/responses/getStorageListByPrivateAccess200'
        '400':
          $ref: '#/components/responses/getStorageListByPrivateAccess400'
        default:
          $ref: '#/components/responses/getStorageListByPrivateAccessDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/storage/public:
    get:
      tags:
      - Storage
      summary: List public storage resources
      description: Returns accessible storage resources whose access type is `public`.
      operationId: getStorageListByPublicAccess
      parameters:
      - $ref: '#/components/parameters/getStorageListByPublicAccessLabel'
      - $ref: '#/components/parameters/getStorageListByPublicAccessSearch'
      - $ref: '#/components/parameters/getStorageListByPublicAccessSortBy'
      - $ref: '#/components/parameters/getStorageListByPublicAccessOrderBy'
      - $ref: '#/components/parameters/getStorageListByPublicAccessLimit'
      - $ref: '#/components/parameters/getStorageListByPublicAccessOffset'
      responses:
        '200':
          $ref: '#/components/responses/getStorageListByPublicAccess200'
        '400':
          $ref: '#/components/responses/getStorageListByPublicAccess400'
        default:
          $ref: '#/components/responses/getStorageListByPublicAccessDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/storage/template:
    get:
      tags:
      - Storage
      summary: List storage templates
      description: Returns accessible storage resources whose type is `template`.
      operationId: getStorageListByTemplate
      parameters:
      - $ref: '#/components/parameters/getStorageListByTemplateLabel'
      - $ref: '#/components/parameters/getStorageListByTemplateSearch'
      - $ref: '#/components/parameters/getStorageListByTemplateSortBy'
      - $ref: '#/components/parameters/getStorageListByTemplateOrderBy'
      - $ref: '#/components/parameters/getStorageListByTemplateLimit'
      - $ref: '#/components/parameters/getStorageListByTemplateOffset'
      responses:
        '200':
          $ref: '#/components/responses/getStorageListByTemplate200'
        '400':
          $ref: '#/components/responses/getStorageListByTemplate400'
        default:
          $ref: '#/components/responses/getStorageListByTemplateDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/storage/{type}/{access}:
    get:
      tags:
      - Storage
      summary: List storage resources by type and access
      description: Returns accessible storage resources matching both the requested storage type and access type.
      operationId: getStorageListByTypeAndAccess
      parameters:
      - $ref: '#/components/parameters/getStorageListByTypeAndAccessType'
      - $ref: '#/components/parameters/getStorageListByTypeAndAccessAccess'
      - $ref: '#/components/parameters/getStorageListByTypeAndAccessLabel'
      - $ref: '#/components/parameters/getStorageListByTypeAndAccessSearch'
      - $ref: '#/components/parameters/getStorageListByTypeAndAccessSortBy'
      - $ref: '#/components/parameters/getStorageListByTypeAndAccessOrderBy'
      - $ref: '#/components/parameters/getStorageListByTypeAndAccessLimit'
      - $ref: '#/components/parameters/getStorageListByTypeAndAccessOffset'
      responses:
        '200':
          $ref: '#/components/responses/getStorageListByTypeAndAccess200'
        '400':
          $ref: '#/components/responses/getStorageListByTypeAndAccess400'
        default:
          $ref: '#/components/responses/getStorageListByTypeAndAccessDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/storage/{uuid}:
    get:
      tags:
      - Storage
      summary: Get storage resource details
      description: Returns detailed information about a storage resource, including its current state, attachments, labels, and backup configuration when applicable.
      operationId: getStorageInfo
      parameters:
      - $ref: '#/components/parameters/getStorageInfoUuid'
      responses:
        '200':
          $ref: '#/components/responses/getStorageInfo200'
        '404':
          $ref: '#/components/responses/getStorageInfo404'
        default:
          $ref: '#/components/responses/getStorageInfoDefault'
      x-upcloud-visibility: public
    put:
      tags:
      - Storage
      summary: Modify Block Storage
      description: Modifies a block storage title, labels, automatic backup rule, or size. A new size must be greater than the current size. Set `filesystem_resize` to `yes` to also resize the last partition and its supported filesystem after increasing the block storage size.
      operationId: modifyStorage
      parameters:
      - $ref: '#/components/parameters/modifyStorageUuid'
      requestBody:
        $ref: '#/components/requestBodies/modifyStorage'
      responses:
        '200':
          $ref: '#/components/responses/modifyStorage200'
        default:
          $ref: '#/components/responses/modifyStorageDefault'
      x-upcloud-visibility: public
    delete:
      tags:
      - Storage
      summary: Delete storage resource
      description: Schedules an unattached private storage resource for deletion. Associated backups are kept by default unless another backup policy is selected.
      operationId: deleteStorage
      parameters:
      - $ref: '#/components/parameters/deleteStorageUuid'
      - $ref: '#/components/parameters/deleteStorageBackups'
      responses:
        '204':
          $ref: '#/components/responses/deleteStorage204'
        default:
          $ref: '#/components/responses/deleteStorageDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/storage/{uuid}/attach:
    post:
      tags:
      - Storage
      summary: Attach storage to a Cloud Server
      description: Attaches the storage resource to a Cloud Server in the same zone. The device defaults to a disk at the next available address. IDE and CD-ROM devices can be attached only while the Cloud Server is stopped; SCSI and VirtIO disks can also be attached while it is running.
      operationId: attachStorageToServer
      parameters:
      - $ref: '#/components/parameters/attachStorageToServerUuid'
      requestBody:
        $ref: '#/components/requestBodies/attachStorageToServer'
      responses:
        '200':
          $ref: '#/components/responses/attachStorageToServer200'
        default:
          $ref: '#/components/responses/attachStorageToServerDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/storage/{uuid}/backup:
    post:
      tags:
      - Storage
      summary: Create on-demand backup
      description: 'Creates a point-in-time backup of private normal block storage. The operation is asynchronous: the source block storage is `backuping` while the backup is created, and the returned backup remains in `maintenance` until it is ready.'
      operationId: createOnDemandBackup
      parameters:
      - $ref: '#/components/parameters/storageCreateOnDemandBackupUuid'
      requestBody:
        $ref: '#/components/requestBodies/storageCreateOnDemandBackup'
      responses:
        '201':
          $ref: '#/components/responses/storageCreateOnDemandBackup201'
        default:
          $ref: '#/components/responses/storageCreateOnDemandBackupDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/storage/{uuid}/cancel:
    post:
      tags:
      - Storage
      summary: Cancel Block Storage operation
      description: Requests cancellation of an interruptible operation on block storage in the `maintenance` state. For a running clone, cancellation removes the incomplete copy and returns the source block storage to the `online` state.
      operationId: cancelStorageOperation
      parameters:
      - $ref: '#/components/parameters/cancelStorageOperationUuid'
      responses:
        '204':
          $ref: '#/components/responses/cancelStorageOperation204'
        default:
          $ref: '#/components/responses/cancelStorageOperationDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/storage/{uuid}/clone:
    post:
      tags:
      - Storage
      summary: Clone Block Storage
      description: 'Creates a Block Storage copy of a storage resource. Cloning is asynchronous: the returned block storage remains in the `maintenance` state until the operation completes and can be monitored with the storage resource details endpoint.'
      operationId: cloneStorage
      parameters:
      - $ref: '#/components/parameters/cloneStorageUuid'
      requestBody:
        $ref: '#/components/requestBodies/cloneStorage'
      responses:
        '201':
          $ref: '#/components/responses/cloneStorage201'
        '404':
          $ref: '#/components/responses/cloneStorage404'
        default:
          $ref: '#/components/responses/cloneStorageDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/storage/{uuid}/detach:
    post:
      tags:
      - Storage
      summary: Detach storage from a Cloud Server
      description: Detaches the storage resource from its attached Cloud Server. IDE and CD-ROM devices can be detached only while the Cloud Server is stopped; SCSI and VirtIO disks can also be detached while it is running. If the storage resource is already detached, it is returned unchanged.
      operationId: detachStorageFromServer
      parameters:
      - $ref: '#/components/parameters/detachStorageFromServerUuid'
      responses:
        '200':
          $ref: '#/components/responses/detachStorageFromServer200'
        default:
          $ref: '#/components/responses/detachStorageFromServerDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/storage/{uuid}/favorite:
    post:
      tags:
      - Storage
      summary: Add storage resource to favorites
      description: Adds an accessible storage resource to the account's favorites. The operation succeeds if the storage resource is already a favorite.
      operationId: addStorageToFavorites
      parameters:
      - $ref: '#/components/parameters/addStorageToFavoritesUuid'
      responses:
        '204':
          $ref: '#/components/responses/addStorageToFavorites204'
        default:
          $ref: '#/components/responses/addStorageToFavoritesDefault'
      x-upcloud-visibility: public
    delete:
      tags:
      - Storage
      summary: Remove storage resource from favorites
      description: Removes an accessible storage resource from the account's favorites. The operation succeeds if the storage resource is not a favorite.
      operationId: removeStorageFromFavorites
      parameters:
      - $ref: '#/components/parameters/removeStorageFromFavoritesUuid'
      responses:
        '204':
          $ref: '#/components/responses/removeStorageFromFavorites204'
        default:
          $ref: '#/components/responses/removeStorageFromFavoritesDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/storage/{uuid}/import:
    get:
      tags:
      - Storage
      summary: Get storage import details
      description: Returns details of the latest import task for a storage resource, including its state, transferred byte counts, checksums, and any error information.
      operationId: getStorageImportDetails
      parameters:
      - $ref: '#/components/parameters/getStorageImportDetailsUuid'
      responses:
        '200':
          $ref: '#/components/responses/getStorageImportDetails200'
        '404':
          $ref: '#/components/responses/getStorageImportDetails404'
        default:
          $ref: '#/components/responses/getStorageImportDetailsDefault'
      x-upcloud-visibility: public
    post:
      tags:
      - Storage
      summary: Create storage import
      description: Creates an asynchronous task that imports a raw disk image into existing Block Storage from an HTTP URL or a temporary direct-upload URL. Attached Cloud Servers must be stopped.
      operationId: createStorageImport
      parameters:
      - $ref: '#/components/parameters/createStorageImportUuid'
      requestBody:
        $ref: '#/components/requestBodies/createStorageImport'
      responses:
        '201':
          $ref: '#/components/responses/createStorageImport201'
        '400':
          $ref: '#/components/responses/createStorageImport400'
        '409':
          $ref: '#/components/responses/createStorageImport409'
        '503':
          $ref: '#/components/responses/createStorageImport503'
        default:
          $ref: '#/components/responses/createStorageImportDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/storage/{uuid}/import/cancel:
    post:
      tags:
      - Storage
      summary: Cancel storage import
      description: Requests cancellation of an ongoing storage import. The task enters the `cancelling` state while imported data is rolled back when necessary.
      operationId: cancelStorageImport
      parameters:
      - $ref: '#/components/parameters/cancelStorageImportUuid'
      responses:
        '202':
          $ref: '#/components/responses/cancelStorageImport202'
        '404':
          $ref: '#/components/responses/cancelStorageImport404'
        '409':
          $ref: '#/components/responses/cancelStorageImport409'
        default:
          $ref: '#/components/responses/cancelStorageImportDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/storage/{uuid}/resize:
    post:
      tags:
      - Storage
      summary: Resize Block Storage partition and filesystem
      description: Resizes the last partition and its supported filesystem to use the block storage capacity already available. A backup is created before the operation and returned on success. Increase the block storage capacity first with the modify block storage endpoint.
      operationId: resizeStorage
      parameters:
      - $ref: '#/components/parameters/resizeStorageUuid'
      responses:
        '200':
          $ref: '#/components/responses/resizeStorage200'
        default:
          $ref: '#/components/responses/resizeStorageDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/storage/{uuid}/restore:
    post:
      tags:
      - Storage
      summary: Restore Block Storage from backup
      description: Starts restoring the backup identified by `uuid` to its origin block storage. If the origin block storage is attached to a Cloud Server, the Cloud Server must be stopped.
      operationId: restoreStorageFromBackup
      parameters:
      - $ref: '#/components/parameters/restoreStorageFromBackupUuid'
      responses:
        '204':
          $ref: '#/components/responses/restoreStorageFromBackup204'
        default:
          $ref: '#/components/responses/restoreStorageFromBackupDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
  /1.3/storage/{uuid}/templatize:
    post:
      tags:
      - Storage
      summary: Create template from Block Storage
      description: 'Creates a private template from private normal block storage. The operation is asynchronous: the returned template remains in `maintenance` until it is ready. Deployments from the template use the source block storage tier.'
      operationId: createTemplateFromStorage
      parameters:
      - $ref: '#/components/parameters/createTemplateFromStorageUuid'
      requestBody:
        $ref: '#/components/requestBodies/createTemplateFromStorage'
      responses:
        '201':
          $ref: '#/components/responses/createTemplateFromStorage201'
        default:
          $ref: '#/components/responses/createTemplateFromStorageDefault'
      x-upcloud-visibility: public
    servers:
    - url: https://api.upcloud.com
components:
  responses:
    removeStorageFromFavoritesDefault:
      description: General failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/storageError'
    addStorageToFavoritesDefault:
      description: General failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/storageError'
    cloneStorageDefault:
      description: General failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/storageError'
    cancelStorageImport202:
      description: Storage import cancellation requested
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/storageImportResponse'
    getStorageInfo200:
      description: Storage resource details
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/storage'
    getStorageInfoDefault:
      description: General failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/storageError'
    createTemplateFromStorageDefault:
      description: General failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/storageError'
    cancelStorageImport404:
      description: The storage resource has no import task
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/storageError'
    createStorageImport400:
      description: Invalid import parameters or unsupported storage type
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/storageError'
    getStorageListByNormal400:
      description: Invalid query parameter value
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/storageError'
    getStorageListByTemplateDefault:
      description: General failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/storageError'
    getStorageListByPublicAccessDefault:
      description: General failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/storageError'
    getStorageListByBackup400:
      description: Invalid query parameter value
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/storageError'
    restoreStorageFromBackup204:
      description: Block storage restore started
    getStorageListByNormalDefault:
      description: General failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/storageError'
    getStorageListDefault:
      description: General failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/storageError'
    storageCreateOnDemandBackupDefault:
      description: General failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/storageError'
    getStorageListByCdromDefault:
      description: General failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/storageError'
    cancelStorageImport409:
      description: The storage import is not in progress
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/storageError'
    getStorageListByTypeAndAccess400:
      description: Invalid query parameter value
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/storageError'
    createStorage201:
      description: Block storage created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/createStorageResponse'
    cancelStorageImportDefault:
      description: General failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/storageError'
    getStorageList200:
      description: A list of storage resources
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/storages'
    getStorageListByPublicAccess200:
      description: A list of storage resources
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/storages'
    createStorageImport409:
      description: The storage or attached Cloud Server is in an incompatible state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/storageError'
    detachStorageFromServer200:
      description: Storage resource detached from Cloud Server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/detachStorageResponse'
    getFavoriteStorageList200:
      description: A list of favorite storage resources
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/storages'
    createStorageDefault:
      description: General failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/storageError'
    getStorageListByPublicAccess400:
      description: Invalid query parameter value
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/storageError'
    cancelStorageOperationDefault:
      description: General failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/storageError'
    getStorageInfo404:
      description: Storage resource not found
    addStorageToFavorites204:
      description: Storage resource added to favorites
    getStorageImportDetailsDefault:
      description: General failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/storageError'
    getStorageListByNormal200:
      description: A list of storage resources
      content:
