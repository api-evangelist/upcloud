      - storage
      additionalProperties: false
      description: Response containing the detached storage resource.
      example:
        storage:
          access: private
          backup_rule: {}
          backups:
            backup: []
          created: '2026-08-26T09:15:00Z'
          encrypted: 'yes'
          labels:
          - key: environment
            value: production
          license: 0
          servers:
            server: []
          size: 50
          state: online
          tier: maxiops
          title: Production data
          type: normal
          uuid: 01d4fcd4-e446-433b-8a9c-551a1284952e
          zone: fi-hel1
    storageUuid:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      format: uuid
      description: Universally unique identifier
      example: 0414e0d7-4436-4037-9dd8-6eaf47dce599
    storage:
      $schema: https://json-schema.org/draft/2020-12/schema
