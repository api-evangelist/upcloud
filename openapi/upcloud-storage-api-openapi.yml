      description: Response schema containing a single storage resource.
      example:
        storage:
          access: private
          backup_rule: {}
          backups:
            backup: []
          created: '2026-08-26T09:15:00Z'
          encrypted: 'no'
          labels: []
          license: 0
          servers:
            server: []
          size: 50
          state: online
          tier: maxiops
          title: Production data
          type: normal
          uuid: 01d4fcd4-e446-433b-8a9c-551a1284952e
          zone: fi-hel1
    storageOffset:
      type: integer
      examples:
      - 0
