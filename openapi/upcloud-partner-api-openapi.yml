      required:
      - error_code
      - error_message
      additionalProperties: false
      description: The attribute password is missing from the request.
    partnerError400EmailMissing:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        error_code:
          type: string
          const: EMAIL_MISSING
        error_message:
          type: string
          examples:
          - The attribute email is missing.
      required:
      - error_code
      - error_message
      additionalProperties: false
      description: The attribute email is missing from the request.
    partnerError400PhoneInvalid:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        error_code:
          type: string
          const: PHONE_INVALID
        error_message:
          type: string
          examples:
          - The attribute phone has an invalid value.
      required:
      - error_code
      - error_message
      additionalProperties: false
      description: The attribute phone has an invalid value.
    partnerAccounts:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: array
      items:
        $ref: '#/components/schemas/partnerAccount'
      description: Collection of partner-managed accounts.
    partnerCreateAccount:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        username:
          type: string
          examples:
          - newuser
        password:
          type: string
          examples:
          - superSecret123
        contact_details:
          type: object
          properties:
            address:
              type: string
              examples:
              - Some street
            city:
              type: string
              examples:
              - Some city
            company:
              type: string
              examples:
              - Some company
            country:
              type: string
              examples:
              - FIN
              format: iso-3166-1-alpha-3
            email:
              type: string
              examples:
              - some.user@example.com
              format: email
            first_name:
              type: string
              examples:
              - Some
            last_name:
              type: string
              examples:
              - User
            phone:
              type: string
              examples:
              - '+358.91234567'
            postal_code:
              type: string
              examples:
              - '00100'
            state:
              type: string
              examples:
              - ''
              description: State or province, if applicable. Required for some countries.
            vat_number:
              type: string
              examples:
              - FI24315605
          required:
          - country
          - email
          - first_name
          - last_name
          - phone
      required:
      - username
      - password
      description: Request payload for creating a partner-managed account.
    partnerError:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        error:
          type: object
          properties:
            error_code:
              type: string
              examples:
              - GENERAL_FAILURE
            error_message:
              type: string
              examples:
              - Your request could not be fulfilled due to a technical issue.
          required:
          - error_code
          - error_message
          additionalProperties: false
      required:
      - error
      additionalProperties: false
      description: A general error response indicating that the request could not be fulfilled due to a technical issue.
    partnerError400CountryInvalid:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        error_code:
          type: string
          const: COUNTRY_INVALID
        error_message:
          type: string
          examples:
          - The attribute country has an invalid value.
      required:
