      - error_message
      additionalProperties: false
      description: The attribute country has an invalid value.
    partnerAccount:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        address:
          type: string
          examples:
          - Some street
        city:
          type: string
          examples:
          - Some city
        company:
          type: string
          examples:
          - Some company
        country:
          type: string
          examples:
          - FIN
          format: iso-3166-1-alpha-3
        email:
          type: string
          examples:
          - some.user@example.com
          format: email
        first_name:
          type: string
          examples:
          - Some
        last_name:
          type: string
          examples:
          - User
        phone:
          type: string
          examples:
          - '+358.91234567'
        postal_code:
          type: string
          examples:
          - '00100'
        state:
          type: string
          examples:
          - ''
        username:
          type: string
          examples:
          - somename
        vat_number:
          type: string
          examples:
          - FI24315605
      required:
      - username
      description: Partner-managed account details.
    partnerError400FirstNameMissing:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        error_code:
          type: string
          const: FIRST_NAME_MISSING
