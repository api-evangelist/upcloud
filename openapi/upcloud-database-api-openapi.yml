    databasePlanComponentsResponse:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      examples:
      - compute:
          family: standard
          node_count: 2
          cpu: 4
          memory_gb: 8
        storage:
          included_gib: 100
          dynamic_storage_supported: true
        backups:
          name: regular
          retention_days: 15
      properties:
        compute:
          type: object
          properties:
            name:
              type: string
              examples:
              - rdb.standard.2CPU-8GB
              description: Compute shape name usable as plan_compute in requests.
            family:
              type: string
              enum:
              - development
              - standard
              - memory
              description: Compute family for tiered plans. Omitted for classic plans.
              example: standard
            node_count:
              type: integer
              format: int32
              description: Number of nodes
              example: 2
            cpu:
              type: integer
              format: int32
              description: CPU cores per node
              example: 4
            memory_gb:
              type: integer
              format: int32
              description: Memory per node in GB
              example: 8
          description: Compute resources per service
        storage:
          type: object
          properties:
            included_gib:
              type: integer
              format: int32
              description: Storage included in the plan per node, in GB. Omitted for tiered (rdb.*) plans, which present storage as a single total_gib.
              example: 100
            dynamic_storage_supported:
              type: boolean
              description: Whether the storage total can be adjusted on top of the plan's included storage.
              example: true
            additional_gib:
              type: integer
              format: int32
              description: Extra dynamic storage configured on the service, in GB. Only present on legacy (non-tiered) service responses; tiered plans present total_gib instead.
              example: 40
            total_gib:
              type: integer
              format: int32
              description: 'Total storage, in GB. For tiered (rdb.*) plans this is the single storage number: the plan''s base storage in the catalog, or the chosen total (included plus dynamic) on a service response. Omitted for legacy catalog plans.'
              example: 140
          description: Storage included in the plan. Omitted for service types without persistent storage.
        backups:
          type: object
          properties:
            name:
              type: string
              enum:
              - mini
              - regular
              - extended
              description: Backup tier name for tiered plans. Omitted when the plan retention does not map to a named tier.
              example: standard
            retention_days:
              type: integer
              format: int32
              description: Backup retention in days
              example: 15
            frequent:
              type: object
              properties:
                interval_minutes:
                  type: integer
                  format: int32
                  example: 60
                retention_days:
                  type: integer
                  format: int32
                  example: 1
              description: Frequent backup window, OpenSearch only
            infrequent:
              type: object
              properties:
                interval_minutes:
                  type: integer
                  format: int32
                  example: 1440
                retention_days:
                  type: integer
                  format: int32
                  example: 14
              description: Infrequent backup window, OpenSearch only
          description: Backup characteristics of the plan
      title: PlanComponentsResponse
      description: Structured breakdown of a service plan into compute, storage and backups components. Sizes are expressed in GB to match plan naming; the classic MB/MiB fields on the plan object are unchanged.
    databaseIndexesResponse:
