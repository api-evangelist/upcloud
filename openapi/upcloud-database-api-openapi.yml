    databasePlansResponse:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      examples:
      - service_types:
        - type: pg
          latest_version: '18.6'
          componentised: true
          zones:
          - fi-hel1
          - de-fra1
          backup_tiers:
          - regular
          - extended
          node_counts:
          - 1
          - 2
          - 3
          compute_shapes:
          - compute: rdb.standard.2CPU-8GB
            family: standard
            cpu: 2
            memory_gb: 8
            dynamic_storage_supported: true
            node_counts:
            - 1
            - 2
            - 3
            backups:
            - regular
            storage:
              step_gib: 10
              dynamic_max_multiplier: 4
              total_cap_gib: 10240
              options:
              - base_gib: 80
                max_gib: 400
      properties:
        service_types:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                examples:
                - pg
                - mysql
                enum:
                - mysql
                - pg
                description: Service type identifier.
              latest_version:
                type: string
                examples:
                - '18.6'
                - 8.4.8
                description: Latest available major version for this service type. Omitted when not applicable.
              componentised:
                type: boolean
                examples:
                - true
                description: Always true for entries in this response; kept as an explicit indicator of componentised plans.
              zones:
                type: array
                items:
                  type: string
                  examples:
                  - fi-hel1
                  - de-fra1
                description: Zones where this service type is available.
              backup_tiers:
                type: array
                items:
                  type: string
                  examples:
                  - regular
                  enum:
                  - mini
                  - regular
                  - extended
                description: Backup tiers offered across this service type's plans. Omitted when the service type exposes no named backup tiers.
              node_counts:
                type: array
                items:
                  type: integer
                  examples:
                  - 1
                  - 2
                  - 3
                  format: int32
                description: Distinct node counts offered across this service type's plans.
              compute_shapes:
                type: array
                items:
                  type: object
                  properties:
                    compute:
                      type: string
                      examples:
                      - rdb.standard.2CPU-8GB
                      description: Compute shape name, usable as plan_compute in requests.
                    family:
                      type: string
                      examples:
                      - standard
                      enum:
                      - development
                      - standard
                      - memory
                      description: Compute family.
                    cpu:
                      type: integer
                      examples:
                      - 2
                      format: int32
                      description: CPU cores per node.
                    memory_gb:
                      type: integer
                      examples:
                      - 8
                      format: int32
                      description: Memory per node in GB.
                    dynamic_storage_supported:
                      type: boolean
                      examples:
                      - true
                      description: Whether the storage total can be scaled beyond the base storage via dynamic storage.
                    node_counts:
                      type: array
                      items:
                        type: integer
                        examples:
                        - 1
                        - 2
                        - 3
                        format: int32
                      description: Node counts available for this compute shape.
                    backups:
                      type: array
                      items:
                        type: string
                        examples:
                        - regular
                        enum:
                        - mini
                        - regular
                        - extended
                      description: Backup tiers available for this compute shape. Omitted when the shape exposes no named backup tiers.
                    storage:
                      type:
                      - object
                      - 'null'
                      properties:
                        step_gib:
                          type: integer
                          examples:
                          - 10
                          format: int32
                          description: Granularity, in GiB, at which dynamic storage can be adjusted.
                        dynamic_max_multiplier:
                          type: integer
                          examples:
                          - 4
                          format: int32
                          description: Maximum multiplier applied to a base size when scaling storage dynamically.
                        total_cap_gib:
                          type:
                          - integer
                          - 'null'
                          examples:
                          - 10240
                          format: int32
                          description: Hard ceiling on base plus dynamic storage, in GiB, or null when the engine enforces no fixed total cap.
                        options:
                          type: array
                          items:
                            type: object
                            properties:
                              base_gib:
                                type: integer
                                examples:
                                - 80
                                format: int32
                                description: Base storage size, in GiB.
                              max_gib:
                                type: integer
                                examples:
                                - 400
                                format: int32
                                description: Largest total storage reachable from this base via dynamic storage (base plus multiplier times base), capped at total_cap_gib where it applies.
                            required:
                            - base_gib
                            - max_gib
                            additionalProperties: false
                          description: Base-storage options offered for this compute shape.
                      required:
                      - step_gib
                      - dynamic_max_multiplier
                      - total_cap_gib
                      - options
                      additionalProperties: false
                      description: 'Storage choices for this compute shape: the distinct base sizes with the total each scales to, plus the shared dynamic-storage rules. Null for shapes without customer storage.'
                  required:
                  - compute
                  - family
                  - cpu
                  - memory_gb
                  - dynamic_storage_supported
                  - node_counts
                  additionalProperties: false
                description: Distinct compute shapes offered for this service type.
            required:
            - type
            - componentised
            - zones
            - node_counts
            - compute_shapes
            additionalProperties: false
          description: Available service types that offer componentised plans.
      title: PlansResponse
      required:
      - service_types
      additionalProperties: false
      description: Lists available componentised database plans.
