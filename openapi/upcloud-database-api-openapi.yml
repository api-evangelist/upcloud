          minimum: 600
          description: 'Warning: reducing this value can make a large batch of binary logs eligible for purge at once. Depending on the volume, this can sometimes stall the MySQL commit path and block writes until the purge completes. To stay on the safe side, prefer lowering the value gradually in small decrements during a low-traffic window rather than dropping it drastically in one step.'
        connect_timeout:
          type: integer
          maximum: 3600
          minimum: 2
          description: The number of seconds that the mysqld server waits for a connect packet before responding with Bad handshake
        default_time_zone:
          type: string
          maxLength: 100
          minLength: 2
          pattern: ^([-+][\d:]*|[\w/]*)$
          description: Default server time zone as an offset from UTC (from -12:00 to +12:00), a time zone name, or 'SYSTEM' to use the MySQL server default.
        div_precision_increment:
          type: integer
          maximum: 30
          minimum: 0
          description: Number of digits by which to increase the scale of the result of division operations performed with the / operator. Default is 4.
        end_markers_in_json:
          type: boolean
          description: Whether optimizer JSON output such as EXPLAIN FORMAT=JSON adds end markers that repeat a structure's key near its closing bracket, making large JSON structures easier to read.
        eq_range_index_dive_limit:
          type: integer
          maximum: 4294967295
          minimum: 0
          description: The number of equality ranges in a query at or above which the optimizer switches from index dives to index statistics when estimating the number of qualifying rows. 0 means always use index dives. Default is 200.
        group_concat_max_len:
          type: integer
          maximum: 18446744073709552000
          minimum: 4
          description: The maximum permitted result length in bytes for the GROUP_CONCAT() function.
        information_schema_stats_expiry:
          type: integer
          maximum: 31536000
          minimum: 900
          description: The time, in seconds, before cached statistics expire
        innodb_adaptive_hash_index:
          type: boolean
          description: 'Whether InnoDB adaptive hash indexing is enabled. The optimal setting is workload-dependent: it speeds up lookups for some workloads but its internal latch can become a contention point under high concurrency, in which case disabling it can improve throughput.'
        innodb_change_buffer_max_size:
          type: integer
          maximum: 50
          minimum: 0
          description: Maximum size for the InnoDB change buffer, as a percentage of the total size of the buffer pool. Default is 25
        innodb_flush_neighbors:
          type: integer
          maximum: 2
          minimum: 0
          description: 'Specifies whether flushing a page from the InnoDB buffer pool also flushes other dirty pages in the same extent (default is 1): 0 - dirty pages in the same extent are not flushed, 1 - flush contiguous dirty pages in the same extent, 2 - flush dirty pages in the same extent'
        innodb_ft_enable_stopword:
          type: boolean
          description: Whether stopword processing is applied when creating or rebuilding an InnoDB FULLTEXT index. Enabled by default.
        innodb_ft_max_token_size:
          type: integer
          maximum: 84
          minimum: 10
          description: Maximum length of words that are stored in an InnoDB FULLTEXT index. Changing this parameter will lead to a restart of the MySQL service.
        innodb_ft_min_token_size:
          type: integer
          maximum: 16
          minimum: 0
          description: Minimum length of words that are stored in an InnoDB FULLTEXT index. Changing this parameter will lead to a restart of the MySQL service.
        innodb_ft_num_word_optimize:
          type: integer
          maximum: 10000
          minimum: 1000
          description: Number of words processed during each OPTIMIZE TABLE operation on an InnoDB FULLTEXT index. Default is 2000.
        innodb_ft_result_cache_limit:
          type: integer
          maximum: 4294967295
          minimum: 1000000
          description: Maximum memory in bytes used per query for the InnoDB FULLTEXT search query result cache. UpCloud sizes this automatically based on the service plan's memory; setting a value overrides the calculated default.
        innodb_ft_server_stopword_table:
          type:
          - 'null'
          - string
          maxLength: 1024
          pattern: ^.+/.+$
          description: This option is used to specify your own InnoDB FULLTEXT index stopword list for all InnoDB tables.
        innodb_ft_user_stopword_table:
          type:
          - 'null'
          - string
          maxLength: 1024
          pattern: ^.+/.+$
          description: This option is used to specify your own InnoDB FULLTEXT index stopword list for specific InnoDB tables.
        innodb_io_capacity:
          type: integer
          maximum: 4294967295
          minimum: 100
          description: The number of I/O operations per second (IOPS) available to InnoDB background tasks, such as flushing pages from the buffer pool and merging data from the change buffer. Set this to a value appropriate for the underlying storage; it must not exceed innodb_io_capacity_max.
        innodb_io_capacity_max:
          type: integer
          maximum: 4294967295
          minimum: 100
          description: The maximum number of I/O operations per second (IOPS) that InnoDB background tasks may perform when flushing falls behind. Defaults to twice innodb_io_capacity (minimum 2000). This must be greater than or equal to innodb_io_capacity.
        innodb_lock_wait_timeout:
          type: integer
          maximum: 3600
          minimum: 1
          description: The length of time in seconds an InnoDB transaction waits for a row lock before giving up. Default is 120.
        innodb_log_buffer_size:
          type: integer
          maximum: 4294967296
          minimum: 1048576
          description: The size in bytes of the buffer that InnoDB uses to write to the log files on disk. Requests above 15% of the RAM provided by your service plan are rejected, because a larger buffer leaves less memory for the buffer pool and client connections.
        innodb_online_alter_log_max_size:
          type: integer
          maximum: 1099511627776
          minimum: 65536
          description: The upper limit in bytes on the size of the temporary log files used during online DDL operations for InnoDB tables.
        innodb_optimize_fulltext_only:
          type: boolean
          description: When enabled, OPTIMIZE TABLE on InnoDB tables only updates the FULLTEXT index instead of rebuilding the table. Intended to be enabled temporarily during FULLTEXT index maintenance and disabled afterwards; while enabled, OPTIMIZE TABLE does not reclaim table space.
        innodb_print_all_deadlocks:
          type: boolean
          description: When enabled, information about all deadlocks in InnoDB user transactions is recorded in the error log. Disabled by default.
        innodb_read_io_threads:
          type: integer
          maximum: 64
          minimum: 1
          description: The number of I/O threads for read operations in InnoDB. Default is 4. Changing this parameter will lead to a restart of the MySQL service.
        innodb_rollback_on_timeout:
          type: boolean
          description: When enabled a transaction timeout causes InnoDB to abort and roll back the entire transaction. Changing this parameter will lead to a restart of the MySQL service.
        innodb_thread_concurrency:
          type: integer
          maximum: 1000
          minimum: 0
          description: Defines the maximum number of threads permitted inside of InnoDB. Default is 0 (infinite concurrency - no limit)
        innodb_write_io_threads:
          type: integer
          maximum: 64
          minimum: 1
          description: The number of I/O threads for write operations in InnoDB. Default is 4. Changing this parameter will lead to a restart of the MySQL service.
        interactive_timeout:
          type: integer
          maximum: 604800
          minimum: 30
          description: The number of seconds the server waits for activity on an interactive connection before closing it.
        internal_tmp_mem_storage_engine:
          type: string
          enum:
          - TempTable
          - MEMORY
          description: The storage engine for in-memory internal temporary tables.
        ip_filter:
          type: array
          items:
            type: string
            title: CIDR address block
            maxLength: 18
            example:
            - 10.0.0.0/24
          description: Allow incoming connections from CIDR address block, e.g. '10.20.0.0/16'
        log_output:
          type: string
          enum:
          - INSIGHTS
          - TABLE
          - INSIGHTS,TABLE
          - NONE
          description: The slow log output destination when slow_query_log is ON. To enable MySQL AI Insights, choose INSIGHTS. To use MySQL AI Insights and the mysql.slow_log table at the same time, choose INSIGHTS,TABLE. To only use the mysql.slow_log table, choose TABLE. To silence slow logs, choose NONE.
        long_query_time:
          type: number
          maximum: 3600
          minimum: 0
          description: The slow_query_logs work as SQL statements that take more than long_query_time seconds to execute.
        lower_case_table_names:
          type: integer
          enum:
          - 0
          - 1
          description: Sets how table and database names are stored and compared. 0 = case-sensitive (default), 1 = names stored lowercase, comparisons are case-insensitive. This option can only be set when creating the service and cannot be changed later. See https://dev.mysql.com/doc/refman/8.0/en/identifier-case-sensitivity.html for details.
        max_allowed_packet:
          type: integer
          maximum: 1073741824
          minimum: 102400
          description: Size of the largest message in bytes that can be received by the server. Default is 67108864 (64M). Statements and rows larger than this are rejected with a packet too large error.
        max_connections:
          type: integer
          maximum: 100000
          minimum: 30
          description: The maximum permitted number of simultaneous client connections. Lower this to reserve memory for other work. The value cannot exceed the limit provided by your service plan. Upgrading the plan does not raise a value you have set explicitly, so increase it yourself after an upgrade.
        max_execution_time:
          type: integer
          maximum: 4294967295
          minimum: 0
          description: Execution timeout in milliseconds for read-only top-level SELECT statements. 0 (the default) means no timeout.
        max_heap_table_size:
          type: integer
          maximum: 1073741824
          minimum: 1048576
          description: Limits the size of internal in-memory tables. Also set tmp_table_size. Default is 16777216 (16M)
        max_seeks_for_key:
          type: integer
          maximum: 18446744073709552000
          minimum: 1
          description: Limit on the assumed maximum number of index seeks when looking up rows based on a key. Lowering this value causes the optimizer to prefer index lookups over table scans.
        max_user_connections:
          type: integer
          maximum: 99990
          minimum: 0
          description: The maximum number of simultaneous connections permitted to any single user account. 0, the default, means no per-account limit. Any other value must be at least 10 below max_connections, so that monitoring and your own admin sessions can still connect when an application saturates its own limit. UpCloud's replication and management connections are unaffected however low you set this.
        migration:
          type:
          - object
          - 'null'
          properties:
            dbname:
              type: string
              title: Database name for bootstrapping the initial connection
              maxLength: 63
            dump_tool:
              type:
              - string
              - 'null'
              title: MySQL migration dump tool
              enum:
              - mysqldump
              - mydumper
              - null
              description: 'Experimental! Tool to use for database dump and restore during migration. Default: mysqldump'
            host:
              type: string
              title: Hostname or IP address of the server where to migrate data from
              maxLength: 255
            ignore_dbs:
              type: string
              title: Comma-separated list of databases, which should be ignored during migration (supported by MySQL and PostgreSQL only at the moment)
              maxLength: 2048
            ignore_roles:
              type: string
              title: Comma-separated list of database roles, which should be ignored during migration (supported by PostgreSQL only at the moment)
              maxLength: 2048
            method:
              type: string
              title: The migration method to be used (currently supported only by Redis, Dragonfly, MySQL and PostgreSQL service types)
              enum:
              - dump
              - replication
            password:
              type: string
              title: Password for authentication with the server where to migrate data from
              maxLength: 256
            port:
              type: integer
              title: Port number of the server where to migrate data from
              maximum: 65535
              minimum: 1
            reestablish_replication:
              type: boolean
              title: Skip dump-restore part and start replication
            ssl:
              type: boolean
              title: The server where to migrate data from is secured with SSL
            username:
              type: string
              title: User name for authentication with the server where to migrate data from
              maxLength: 256
          required:
          - host
          - port
          additionalProperties: false
        mysql_incremental_backup:
          type: object
          properties:
            enabled:
              type: boolean
              title: Enable incremental backups
              description: Enable periodic incremental backups. When enabled, full_backup_week_schedule must be set. Incremental backups only store changes since the last backup, making them faster and more storage-efficient than full backups. This is particularly useful for large databases where daily full backups would be too time-consuming or expensive.
            full_backup_week_schedule:
              type:
              - string
              - 'null'
              title: Full backup week schedule
              pattern: ^[a-z]+(,[a-z]+)*$
              description: 'Comma-separated list of days of the week when full backups should be created. Valid values: mon, tue, wed, thu, fri, sat, sun'
          required:
          - enabled
          additionalProperties: false
        net_buffer_length:
          type: integer
          maximum: 1048576
          minimum: 1024
          description: Start sizes of connection buffer and result buffer. Default is 16384 (16K). Changing this parameter will lead to a restart of the MySQL service.
        net_read_timeout:
          type: integer
          maximum: 3600
          minimum: 1
          description: The number of seconds to wait for more data from a connection before aborting the read.
        net_write_timeout:
          type: integer
          maximum: 3600
          minimum: 1
          description: The number of seconds to wait for a block to be written to a connection before aborting the write.
        optimizer_prune_level:
          type: integer
          maximum: 1
          minimum: 0
          description: Controls the heuristics applied during query optimization to prune less-promising partial plans from the optimizer search space. 0 disables heuristics (exhaustive search); 1 prunes plans based on the number of rows retrieved.
        optimizer_search_depth:
          type: integer
          maximum: 62
          minimum: 0
          description: Maximum depth of search performed by the query optimizer when choosing a join order. Larger values produce better plans for joins over many tables but take longer to compile; 0 lets the optimizer choose the depth automatically.
        optimizer_switch:
          type: string
          pattern: ^(default|[a-z_]+=(on|off|default)(,[a-z_]+=(on|off|default))*)$
          description: Comma-separated list of optimizer flag assignments in the form flag=on|off|default, or the single value 'default' to reset all flags. Flags not listed keep their current values. Controls query optimizer behaviors such as index merge, hash join and semijoin strategies.
        performance_schema_events_statements_history_size:
          type:
          - integer
          - 'null'
          maximum: 1024
          minimum: 0
          description: The number of rows per thread in the events_statements_history table. Changing this parameter will lead to a restart of the MySQL service.
        public_access:
          type: boolean
          description: Allow access to the service from the public Internet
        public_access_prometheus:
          type: boolean
          description: Allow access to Prometheus metrics from the public Internet
        relay_log_space_limit:
          type: integer
          maximum: 18446744073709552000
          minimum: 134217728
          description: The maximum amount of space in bytes to use for all relay logs while replicating from an external migration source. When the limit is reached, the replication I/O thread stops fetching relay log events until the SQL thread has caught up. Raise this to give a large migration a bigger relay-log budget; ensure the service disk is sized accordingly. The setting applies only on the node replicating from the external source; standby nodes always use the UpCloud-managed default (the smaller of 5 GiB and 30% of the service disk), which is also used when this option is left unset. Changing this parameter will lead to a restart of the MySQL service.
        service_log:
          type:
          - boolean
          - 'null'
          description: Store logs for the service so that they are available in the HTTP API and console.
        slow_query_log:
          type: boolean
          description: Slow query log enables capturing of slow queries. Setting slow_query_log to false also truncates the mysql.slow_log table.
        sort_buffer_size:
          type: integer
          maximum: 1073741824
          minimum: 32768
          description: Sort buffer size in bytes for ORDER BY optimization. Default is 262144 (256K). Requests above 2% of the RAM provided by your service plan are rejected, because the buffer is allocated per session and its cost multiplies with the connection count.
        sql_mode:
          type: string
          maxLength: 1024
          pattern: ^[A-Z_]*(,[A-Z_]+)*$
          description: Global SQL mode. Set to empty to use MySQL server defaults. When creating a new service and not setting this field UpCloud default SQL mode (strict, SQL standard compliant) will be assigned.
        sql_require_primary_key:
          type: boolean
          description: Require primary key to be defined for new tables or old tables modified with ALTER TABLE and fail if missing. It is recommended to always have primary keys because various functionality may break if any large table is missing them.
        tmp_table_size:
          type: integer
          maximum: 1073741824
          minimum: 1048576
          description: Limits the size of internal in-memory tables. Also set max_heap_table_size. Default is 16777216 (16M)
        version:
          type: string
          enum:
          - '8.4'
        wait_timeout:
          type: integer
          maximum: 2147483
          minimum: 1
          description: The number of seconds the server waits for activity on a noninteractive connection before closing it. Requests to set this below 30 are rejected, because a shorter timeout closes your own idle connections between statements.
        windowing_use_high_precision:
          type: boolean
          description: Whether window functions are computed to high precision. Disabling this trades exactness for speed in window function evaluation.
      additionalProperties: false
      description: mysql properties
    databaseIntegrationEndpointModify:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        properties:
          type: object
          additionalProperties: true
          example:
            server: 3.3.3.3
            port: 514
            tls: true
      title: IntegrationEndpointModify
      additionalProperties: false
      description: Schema for modifying an integration endpoint.
    databaseServiceCloneValkey:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      allOf:
      - not:
          anyOf:
          - required:
            - plan_compute
          - required:
            - plan_node_count
          - required:
            - plan_storage_gib
          - required:
            - plan_backups
          required:
          - plan
          description: plan and the plan_* selection fields are mutually exclusive
      - not:
          required:
          - plan_storage_gib
          - additional_disk_space_gib
        description: plan_storage_gib is total storage and excludes additional_disk_space_gib
      properties:
        hostname_prefix:
          type: string
          examples:
          - my-service
          maxLength: 30
          minLength: 3
          description: Hostname prefix
        plan:
          type: string
          examples:
          - basic-plan
          minLength: 1
          description: Plan
        plan_compute:
          type: string
          examples:
          - rdb.standard.2CPU-8GB
          minLength: 1
          description: 'Plan selection: compute shape combining family, CPU and memory as one token, as listed in the plan catalog components. PostgreSQL and MySQL only.'
        plan_node_count:
          type: integer
          examples:
          - 1
          maximum: 16
          minimum: 1
          format: int32
          description: 'Plan selection: number of nodes.'
        plan_storage_gib:
          type: integer
          examples:
          - 50
          minimum: 1
          format: int32
          description: 'Plan selection: desired TOTAL storage per node in GiB. Resolution picks the plan whose included storage matches, or tops the closest plan up with dynamic additional storage within the allowed limits. Mutually exclusive with additional_disk_space_gib.'
        plan_backups:
          type: string
          examples:
          - regular
          enum:
          - mini
          - regular
          - extended
          description: 'Plan selection: backup tier. PostgreSQL and MySQL tiered plans only.'
        title:
          $ref: '#/components/schemas/databaseTitle'
        clone_time:
          type: string
          examples:
          - '2024-01-30T15:04:05Z'
          maxLength: 32
          format: date-time
          description: Clone time
          example: '2024-01-30T15:04:05Z'
        backup_name:
          type: string
          examples:
          - daily-backup-2024-01-30
          maxLength: 128
          pattern: ^[a-zA-Z0-9-_:.]+$
          format: string
          description: Backup name
        set_service_uuid:
          type: string
          examples:
          - 123e4567-e89b-12d3-a456-426614174000
          format: uuid
          description: Title
        zone:
          type: string
          examples:
          - fi-hel1
          pattern: ^[a-z]{2}-[a-z]{3}\d$
          description: Zone
        termination_protection:
          type: boolean
          examples:
          - true
          - false
          description: Termination protection
        maintenance:
          type: object
          properties:
            dow:
              $ref: '#/components/schemas/databaseMaintenanceDow'
            time:
              $ref: '#/components/schemas/databaseMaintenanceTime'
          required:
          - dow
          - time
          description: Maintenance
        networks:
          type: array
          items:
            $ref: '#/components/schemas/databaseNetworkCreate'
          maxItems: 8
        labels:
          type: array
          items:
            $ref: '#/components/schemas/databaseLabelCreate'
          maxItems: 255
          description: Labels
        properties:
          $ref: '#/components/schemas/databaseServicePropertiesValkey'
      title: ServiceCloneValkey
      required:
      - hostname_prefix
      additionalProperties: false
      description: Schema for cloning a service with valkey.
    databaseUserResponse:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      examples:
      - username: admin
        password: my-password
        authentication: caching_sha2_password
        type: admin
      properties:
        username:
          type: string
          description: The username of the user.
          example: admin
        password:
          type: string
          description: The password of the user.
          example: my-password
        authentication:
          type: string
          description: The authentication method used by the user.
          example: caching_sha2_password
        type:
          type: string
          description: The type of the user.
          example: admin
        pg_access_control:
          $ref: '#/components/schemas/databasePgAccessControlResponse'
        redis_access_control:
          $ref: '#/components/schemas/databaseRedisAccessControlResponse'
        valkey_access_control:
          $ref: '#/components/schemas/databaseValkeyAccessControlResponse'
        opensearch_access_control:
          $ref: '#/components/schemas/databaseOpenSearchAccessControlResponse'
      title: UserResponse
      description: Schema for a user response.
    LogicalDatabaseCreate:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      examples:
      - name: my_database
        lc_collate: en_US.UTF-8
        lc_ctype: en_US.UTF-8
      properties:
        name:
          type: string
          examples:
          - my_database
          description: logical database name
        lc_collate:
          type: string
          examples:
          - en_US.UTF-8
          description: Collation order
        lc_ctype:
          type: string
          examples:
          - en_US.UTF-8
          description: Category of a locale definition source file
      title: LogicalDatabaseCreate
      required:
      - name
      additionalProperties: false
      description: Schema for creating a logical database.
