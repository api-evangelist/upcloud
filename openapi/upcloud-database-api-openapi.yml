    databaseServiceCloneOpenAPI:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      oneOf:
      - $ref: '#/components/schemas/databaseServiceCloneMysql'
      - $ref: '#/components/schemas/databaseServiceClonePg'
      - $ref: '#/components/schemas/databaseServiceCloneRedis'
      - $ref: '#/components/schemas/databaseServiceCloneOpensearch'
      - $ref: '#/components/schemas/databaseServiceCloneValkey'
      examples:
      - title: new-title
        hostname_prefix: new-hostname-prefix
        clone_time: '2022-01-21T12:21:00Z'
        plan: 1x1xCPU-2GB-25GB
        zone: fi-hel1
        maintenance:
          dow: sunday
          time: '12:00:00'
        properties:
          automatic_utility_network_ip_filter: false
          version: '13'
          public_access: true
          ip_filter:
          - 0.0.0.0/0
      properties:
        plan:
          type: string
          examples:
          - 1x1xCPU-2GB-25GB
          - rdb.standard.2x-2CPU-8GB-120GB-regular
          description: 'Deprecated: prefer the plan_* selection fields (plan_compute, plan_node_count, plan_storage_gib, plan_backups) for PostgreSQL and MySQL. The plan name remains supported, and required for engines without componentised plans. For componentised (rdb.*) plans the storage segment is the desired TOTAL storage per node: any total reachable from a catalog plan''s included storage in the plan''s storage steps (within its cap) is a valid plan name, e.g. rdb.standard.2x-2CPU-8GB-120GB-regular selects the 80GB catalog plan with a 40GB dynamic top-up.'
          deprecated: true
        plan_compute:
          type: string
          examples:
          - rdb.standard.2CPU-8GB
          description: 'Plan selection: compute shape combining family, CPU and memory as one token, as listed in the plan catalog components. PostgreSQL and MySQL only.'
        plan_node_count:
          type: integer
          examples:
          - 1
          description: 'Plan selection: number of nodes.'
        plan_storage_gib:
          type: integer
          examples:
          - 120
          description: 'Plan selection: desired TOTAL storage per node in GiB. Resolution picks the plan whose included storage matches, or tops the closest plan up with dynamic additional storage within the allowed limits. Mutually exclusive with additional_disk_space_gib.'
        plan_backups:
          type: string
          examples:
          - regular
          enum:
          - mini
          - regular
          - extended
          description: 'Plan selection: backup tier. PostgreSQL and MySQL tiered plans only.'
        additional_disk_space_gib:
          type: integer
          examples:
          - 10
          description: 'Additional disk space in GiB. Legacy plans only: componentised (rdb.*) plans set storage as a total via plan_storage_gib or the plan name.'
          deprecated: true
      title: ServiceCloneOpenAPI
      additionalProperties: false
      description: Schema for cloning a service — OpenAPI version.
