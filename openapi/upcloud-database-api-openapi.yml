    databaseServiceCloneOpensearch:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      allOf:
      - not:
          anyOf:
          - required:
            - plan_compute
          - required:
            - plan_node_count
          - required:
            - plan_storage_gib
          - required:
            - plan_backups
          required:
          - plan
          description: plan and the plan_* selection fields are mutually exclusive
      - not:
          required:
          - plan_storage_gib
          - additional_disk_space_gib
        description: plan_storage_gib is total storage and excludes additional_disk_space_gib
      examples:
      - hostname_prefix: my-opensearch
        plan: my-plan
        clone_time: '2024-01-30T15:04:05Z'
        backup_name: daily-backup-2024-01-30
        zone: fi-hel1
        termination_protection: false
        maintenance:
          dow: monday
          time: 03:00:00
        additional_disk_space_gib: 10
      - hostname_prefix: search-prod
        plan: enterprise-plan
        backup_name: weekly-backup-2024-02-05
        zone: us-nyc1
        termination_protection: true
        maintenance:
          dow: wednesday
          time: '22:30:00'
        additional_disk_space_gib: 20
      properties:
        hostname_prefix:
          type: string
          examples:
          - my-opensearch
          maxLength: 30
          minLength: 3
          description: Hostname prefix
        plan:
          type: string
          examples:
          - my-plan
          minLength: 1
          description: Plan
        plan_compute:
          type: string
          examples:
          - rdb.standard.2CPU-8GB
          minLength: 1
          description: 'Plan selection: compute shape combining family, CPU and memory as one token, as listed in the plan catalog components. PostgreSQL and MySQL only.'
        plan_node_count:
          type: integer
          examples:
          - 1
          maximum: 16
          minimum: 1
          format: int32
          description: 'Plan selection: number of nodes.'
        plan_storage_gib:
          type: integer
          examples:
          - 50
          minimum: 1
          format: int32
          description: 'Plan selection: desired TOTAL storage per node in GiB. Resolution picks the plan whose included storage matches, or tops the closest plan up with dynamic additional storage within the allowed limits. Mutually exclusive with additional_disk_space_gib.'
        plan_backups:
          type: string
          examples:
          - regular
          enum:
          - mini
          - regular
          - extended
          description: 'Plan selection: backup tier. PostgreSQL and MySQL tiered plans only.'
        title:
          $ref: '#/components/schemas/databaseTitle'
        clone_time:
          type: string
          examples:
          - '2024-01-30T15:04:05Z'
          maxLength: 32
          format: date-time
          description: Clone time
          example: '2024-01-30T15:04:05Z'
        backup_name:
          type: string
          examples:
          - daily-backup-2024-01-30
          maxLength: 128
          pattern: ^[a-zA-Z0-9-_:.]+$
          format: string
          description: Backup name
        set_service_uuid:
          type: string
          examples:
          - 123e4567-e89b-12d3-a456-426614174000
          format: uuid
          description: Title
        zone:
          type: string
          examples:
          - fi-hel1
          pattern: ^[a-z]{2}-[a-z]{3}\d$
          description: Zone
        termination_protection:
          type: boolean
          examples:
          - true
          - false
          description: Termination protection
        maintenance:
          type: object
          properties:
            dow:
              $ref: '#/components/schemas/databaseMaintenanceDow'
            time:
              $ref: '#/components/schemas/databaseMaintenanceTime'
          required:
          - dow
          - time
          description: Maintenance
        networks:
          type: array
          items:
            $ref: '#/components/schemas/databaseNetworkCreate'
          maxItems: 8
          description: Networks
        labels:
          type: array
          items:
            $ref: '#/components/schemas/databaseLabelCreate'
          maxItems: 255
          description: Labels
        additional_disk_space_gib:
          type: integer
          examples:
          - 10
          - 20
          format: int32
          description: Additional disk space in GiB
        properties:
          $ref: '#/components/schemas/databaseServicePropertiesOpensearch'
      title: ServiceCloneOpensearch
      required:
      - hostname_prefix
      additionalProperties: false
      description: Schema for cloning an OpenSearch service
    databasePgCurrentSessionResponse:
