            - 2.744682398273781
            - 3.054323473090861
          - - '2022-01-21T13:11:00Z'
            - 3.0735645433218366
            - 2.972423595745795
          - - '2022-01-21T13:11:30Z'
            - 2.61619694060839
            - 3.1358378052207883
          - - '2022-01-21T13:12:00Z'
            - 3.275132296130991
