        query_duration: '00:00:01.234'
        query_start: '2025-09-21T12:35:10Z'
        state: active
        state_change: '2025-09-21T12:35:10Z'
        usename: upadmin
        usesysid: 10
        wait_event: ClientRead
        wait_event_type: Client
        xact_start: '2025-09-21T12:35:05Z'
      properties:
