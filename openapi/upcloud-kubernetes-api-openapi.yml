              labels:
              - key: managedBy
                value: exampleStagingTeam
              - key: environment
                value: staging
              name: example-node-group-medium
              plan: K8S-4xCPU-8GB
              ssh_keys:
              - ssh-rsa 
              state: pending
              storage: 01000000-0000-4000-8000-000160010100
              taints:
              - effect: NoSchedule
                key: environment
                value: staging
            uuid: 11111111-1111-1111-1111-111111111111
            state: pending
            zone: de-fra1
    kubernetesDeleteClusterAuthentication204:
      description: Authentication entry deleted.
    kubernetesGetAvailableUpgrades:
      description: 200 upgrades response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/kubernetesClusterAvailableUpgrades'
          example:
          - versions:
            - 1.31.8
            - 1.32.0
    kubernetesPatchCluster:
      description: 202 patchCluster response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/kubernetesCluster'
          example:
            control_plane_ip_filter:
            - 1.2.3.0/24
            - 1.1.1.1
            name: example-cluster
            network: 33333333-3333-3333-333333333333
            network_cidr: 172.16.0.0/24
            node_groups:
            - count: 4
              kubelet_args:
              - key: log-flush-frequency
                value: 5s
              labels:
              - key: managedBy
                value: exampleDevelopmentTeam
              - key: environment
                value: development
              name: example-node-group-small
              plan: K8S-2xCPU-4GB
              ssh_keys:
              - ssh-rsa 
              state: pending
              storage: 01000000-0000-4000-8000-000160010100
              taints:
              - effect: NoSchedule
                key: environment
                value: development
            - count: 8
              kubelet_args:
              - key: log-flush-frequency
                value: 15s
              labels:
              - key: managedBy
                value: exampleStagingTeam
              - key: environment
                value: staging
              name: example-node-group-medium
              plan: K8S-4xCPU-8GB
              ssh_keys:
              - ssh-rsa 
              state: running
              storage: 01000000-0000-4000-8000-000160010100
              taints:
              - effect: NoSchedule
                key: environment
                value: staging
            uuid: 11111111-1111-1111-1111-111111111111
            state: running
            zone: de-fra1
    kubernetesUnProcessableEntity:
      description: 422 Unprocessable entity
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/kubernetesError'
          example:
