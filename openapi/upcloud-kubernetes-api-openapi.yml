openapi: 3.2.0
info:
  title: Upcloud Kubernetes API
  version: '1.3'
  contact:
    name: UpCloud
    url: https://upcloud.com
    email: hello@upcloud.com
  license:
    name: MIT
    url: https://spdx.org/licenses/MIT.html
  termsOfService: https://upcloud.com/terms-of-service/
  description: 'Operations tagged kubernetes across 2 of this provider''s published API definitions: upcloud-openapi.json, upcloud-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.upcloud.com
security:
- apiToken: []
tags:
- name: Kubernetes
  description: 'Kubernetes is a container orchestration system for automating, managing and scaling software deployment.

    Managed Kubernetes allows you to easily create Kubernetes clusters without having to take care about low level details.'
  x-displayName: Kubernetes
paths:
  /1.3/kubernetes:
    get:
      tags:
      - Kubernetes
      summary: List clusters
      description: Returns a list of Kubernetes clusters.
      operationId: listKubernetesClusters
      responses:
        '200':
          $ref: '#/components/responses/kubernetesGetClusters'
        '400':
          $ref: '#/components/responses/kubernetesBadRequest'
        '401':
          $ref: '#/components/responses/kubernetesUnAuthorized'
        default:
          $ref: '#/components/responses/kubernetesInternalServerError'
    post:
      tags:
      - Kubernetes
      summary: Create cluster
      description: Creates a new Kubernetes cluster.
      operationId: createKubernetesCluster
      requestBody:
        $ref: '#/components/requestBodies/kubernetesPostCluster'
      responses:
        '201':
          $ref: '#/components/responses/kubernetesPostCluster'
        '400':
          $ref: '#/components/responses/kubernetesBadRequest'
        '401':
          $ref: '#/components/responses/kubernetesUnAuthorized'
        '404':
          $ref: '#/components/responses/kubernetesNotFound'
        '422':
          $ref: '#/components/responses/kubernetesUnProcessableEntity'
        default:
          $ref: '#/components/responses/kubernetesInternalServerError'
    servers:
    - url: https://api.upcloud.com
  /1.3/kubernetes/{uuid}:
    parameters:
    - $ref: '#/components/parameters/kubernetesUuid'
    get:
      tags:
      - Kubernetes
      summary: Get cluster details
      description: Returns Kubernetes cluster details by given `uuid`.
      operationId: getKubernetesCluster
      responses:
        '200':
          $ref: '#/components/responses/kubernetesGetCluster'
        '400':
          $ref: '#/components/responses/kubernetesBadRequest'
        '401':
          $ref: '#/components/responses/kubernetesUnAuthorized'
        '404':
          $ref: '#/components/responses/kubernetesNotFound'
        default:
          $ref: '#/components/responses/kubernetesInternalServerError'
    delete:
      tags:
      - Kubernetes
      summary: Delete cluster
      description: Deletes an existing Kubernetes cluster by given `uuid`.
      operationId: deleteKubernetesCluster
      responses:
        '202':
          $ref: '#/components/responses/kubernetesDeleteCluster'
        '401':
          $ref: '#/components/responses/kubernetesUnAuthorized'
        '404':
          $ref: '#/components/responses/kubernetesNotFound'
        default:
          $ref: '#/components/responses/kubernetesInternalServerError'
    patch:
      tags:
      - Kubernetes
      summary: Modify cluster
      description: Modifies an existing Kubernetes cluster by given `{uuid}`.
      operationId: modifyKubernetesCluster
      requestBody:
        $ref: '#/components/requestBodies/kubernetesPatchCluster'
      responses:
        '200':
          $ref: '#/components/responses/kubernetesPatchCluster'
        '400':
          $ref: '#/components/responses/kubernetesBadRequest'
        '401':
          $ref: '#/components/responses/kubernetesUnAuthorized'
        '404':
          $ref: '#/components/responses/kubernetesNotFound'
        default:
          $ref: '#/components/responses/kubernetesInternalServerError'
    servers:
    - url: https://api.upcloud.com
  /1.3/kubernetes/{uuid}/kubeconfig:
    parameters:
    - $ref: '#/components/parameters/kubernetesUuid'
    get:
      tags:
      - Kubernetes
      summary: Get kubeconfig
      description: Returns kubeconfig for Kubernetes cluster by given `{uuid}`.
      operationId: getKubernetesClusterKubeconfig
      responses:
        '200':
          $ref: '#/components/responses/kubernetesGetClusterKubeconfig'
        '401':
          $ref: '#/components/responses/kubernetesUnAuthorized'
        '404':
          $ref: '#/components/responses/kubernetesNotFound'
        default:
          $ref: '#/components/responses/kubernetesInternalServerError'
    servers:
    - url: https://api.upcloud.com
  /1.3/kubernetes/{uuid}/available-upgrades:
    parameters:
    - $ref: '#/components/parameters/kubernetesUuid'
    get:
      tags:
      - Kubernetes
      summary: Get available upgrades
      description: Returns a list of available versions that can be used to upgrade the cluster.
      operationId: getKubernetesClusterAvailableUpgrades
      responses:
        '200':
          $ref: '#/components/responses/kubernetesGetAvailableUpgrades'
        '401':
          $ref: '#/components/responses/kubernetesUnAuthorized'
        '404':
          $ref: '#/components/responses/kubernetesNotFound'
        default:
          $ref: '#/components/responses/kubernetesInternalServerError'
    post:
      tags:
      - Kubernetes
      summary: Upgrade cluster
      description: Upgrades an existing Kubernetes cluster to specific version.
      operationId: upgradeKubernetesCluster
      requestBody:
        $ref: '#/components/requestBodies/kubernetesPostUpgrade'
      responses:
        '201':
          $ref: '#/components/responses/kubernetesPostUpgrade'
        '401':
          $ref: '#/components/responses/kubernetesUnAuthorized'
        '404':
          $ref: '#/components/responses/kubernetesNotFound'
        '422':
          $ref: '#/components/responses/kubernetesUnProcessableEntity'
        default:
          $ref: '#/components/responses/kubernetesInternalServerError'
    servers:
    - url: https://api.upcloud.com
  /1.3/kubernetes/{uuid}/node-groups:
    parameters:
    - $ref: '#/components/parameters/kubernetesUuid'
    get:
      tags:
      - Kubernetes
      summary: List node groups
      description: 'Returns a list of available node groups of an existing Kubernetes cluster. Cluster is identified by given `{uuid}`.


        A node group is a uniform set of worker nodes attached to a cluster.'
      operationId: listKubernetesClusterNodeGroups
      responses:
        '200':
          $ref: '#/components/responses/kubernetesGetNodeGroups'
        '401':
          $ref: '#/components/responses/kubernetesUnAuthorized'
        '404':
          $ref: '#/components/responses/kubernetesNotFound'
        default:
          $ref: '#/components/responses/kubernetesInternalServerError'
    post:
      tags:
      - Kubernetes
      summary: Create node group
      description: Creates a new node group to an existing Kubernetes cluster. Cluster is identified by given `{uuid}`.
      operationId: createKubernetesClusterNodeGroup
      requestBody:
        $ref: '#/components/requestBodies/kubernetesPostNodeGroup'
      responses:
        '201':
          $ref: '#/components/responses/kubernetesPostNodeGroup'
        '401':
          $ref: '#/components/responses/kubernetesUnAuthorized'
        '404':
          $ref: '#/components/responses/kubernetesNotFound'
        '422':
          $ref: '#/components/responses/kubernetesUnProcessableEntity'
        default:
          $ref: '#/components/responses/kubernetesInternalServerError'
    servers:
    - url: https://api.upcloud.com
  /1.3/kubernetes/{uuid}/node-groups/{name}:
    parameters:
    - $ref: '#/components/parameters/kubernetesUuid'
    - $ref: '#/components/parameters/kubernetesName'
    get:
      tags:
      - Kubernetes
      summary: Get node group details
      description: Returns node group details by given `{node_group_name}`. Cluster is identified by given `{uuid}`.
      operationId: getKubernetesClusterNodeGroup
      responses:
        '200':
          $ref: '#/components/responses/kubernetesGetNodeGroupDetails'
        '401':
          $ref: '#/components/responses/kubernetesUnAuthorized'
        '404':
          $ref: '#/components/responses/kubernetesNotFound'
        default:
          $ref: '#/components/responses/kubernetesInternalServerError'
    delete:
      tags:
      - Kubernetes
      summary: Delete node group
      description: Deletes an existing node group by given Kubernetes cluster `{uuid}` and `{node_group_name}`.
      operationId: deleteKubernetesClusterNodeGroup
      responses:
        '202':
          $ref: '#/components/responses/kubernetesDeleteNodeGroup'
        '401':
          $ref: '#/components/responses/kubernetesUnAuthorized'
        '404':
          $ref: '#/components/responses/kubernetesNotFound'
        default:
          $ref: '#/components/responses/kubernetesInternalServerError'
    patch:
      tags:
      - Kubernetes
      summary: Modify node group
      description: Modifies an existing node group of a cluster. Cluster is identified by given `{uuid}` and node group by `{node_group_name}`.
      operationId: modifyKubernetesClusterNodeGroup
      requestBody:
        $ref: '#/components/requestBodies/kubernetesPatchNodeGroup'
      responses:
        '200':
          $ref: '#/components/responses/kubernetesPatchNodeGroup'
        '401':
          $ref: '#/components/responses/kubernetesUnAuthorized'
        '404':
          $ref: '#/components/responses/kubernetesNotFound'
        '422':
          $ref: '#/components/responses/kubernetesUnProcessableEntity'
        default:
          $ref: '#/components/responses/kubernetesInternalServerError'
    servers:
    - url: https://api.upcloud.com
  /1.3/kubernetes/{uuid}/node-groups/{name}/{node-name}:
    parameters:
    - $ref: '#/components/parameters/kubernetesUuid'
    - $ref: '#/components/parameters/kubernetesName'
    - $ref: '#/components/parameters/kubernetesNodeName'
    delete:
      tags:
      - Kubernetes
      summary: Delete node group node
      description: Deletes a node group node from a cluster (experimental). Cluster is identified by given `{uuid}`, node group by `{name}`, and node by `{node-name}`.
      operationId: deleteKubernetesClusterNodeGroupNode
      responses:
        '202':
          $ref: '#/components/responses/kubernetesDeleteNodeGroupNode'
        '401':
          $ref: '#/components/responses/kubernetesUnAuthorized'
        '404':
          $ref: '#/components/responses/kubernetesNotFound'
        default:
          $ref: '#/components/responses/kubernetesInternalServerError'
    servers:
    - url: https://api.upcloud.com
  /1.3/kubernetes/plans:
    get:
      tags:
      - Kubernetes
      summary: List plans
      description: Returns a list of available Kubernetes cluster plans.
      operationId: listKubernetesPlans
      responses:
        '200':
          $ref: '#/components/responses/kubernetesGetPlan'
        '401':
          $ref: '#/components/responses/kubernetesUnAuthorized'
        default:
          $ref: '#/components/responses/kubernetesInternalServerError'
    servers:
    - url: https://api.upcloud.com
  /1.3/kubernetes/versions:
    get:
      tags:
      - Kubernetes
      summary: List versions
      description: Returns a list of available Kubernetes cluster versions.
      operationId: listKubernetesVersions
      responses:
        '200':
          $ref: '#/components/responses/kubernetesGetVersion'
        '401':
          $ref: '#/components/responses/kubernetesUnAuthorized'
        default:
          $ref: '#/components/responses/kubernetesInternalServerError'
    servers:
    - url: https://api.upcloud.com
  /1.3/kubernetes/{uuid}/authentication:
    get:
      tags:
      - Kubernetes
      summary: List cluster authentication entries
      description: Returns all OIDC authentication issuer configurations for a cluster.
      operationId: listClusterAuthentication
      parameters:
      - $ref: '#/components/parameters/kubernetesUuid'
      responses:
        '200':
          $ref: '#/components/responses/kubernetesListClusterAuthentication200'
        '401':
          $ref: '#/components/responses/kubernetesUnAuthorized'
        '404':
          $ref: '#/components/responses/kubernetesNotFound'
        default:
          $ref: '#/components/responses/kubernetesInternalServerError'
    put:
      tags:
      - Kubernetes
      summary: Replace the full cluster authentication configuration
      description: Replaces the entire set of OIDC authentication issuer configurations for a cluster with the supplied JSON list of issuers. The full set is validated before being applied. An empty list clears all issuers.
      operationId: setClusterAuthentication
      parameters:
      - $ref: '#/components/parameters/kubernetesUuid'
      requestBody:
        $ref: '#/components/requestBodies/kubernetesSetClusterAuthentication'
      responses:
        '200':
          $ref: '#/components/responses/kubernetesSetClusterAuthentication200'
        '400':
          $ref: '#/components/responses/kubernetesBadRequest'
        '401':
          $ref: '#/components/responses/kubernetesUnAuthorized'
        '404':
          $ref: '#/components/responses/kubernetesNotFound'
        default:
          $ref: '#/components/responses/kubernetesInternalServerError'
    post:
      tags:
      - Kubernetes
      summary: Create a cluster authentication entry
      description: Creates a new OIDC authentication issuer configuration. The new entry is validated together with the cluster's existing entries before being applied. Fails if an entry with the same name already exists.
      operationId: createClusterAuthentication
      parameters:
      - $ref: '#/components/parameters/kubernetesUuid'
      requestBody:
        $ref: '#/components/requestBodies/kubernetesCreateClusterAuthentication'
      responses:
        '201':
          $ref: '#/components/responses/kubernetesCreateClusterAuthentication201'
        '400':
          $ref: '#/components/responses/kubernetesBadRequest'
        '401':
          $ref: '#/components/responses/kubernetesUnAuthorized'
        '404':
          $ref: '#/components/responses/kubernetesNotFound'
        '409':
          $ref: '#/components/responses/kubernetesConflict'
        default:
          $ref: '#/components/responses/kubernetesInternalServerError'
    servers:
    - url: https://api.upcloud.com
  /1.3/kubernetes/{uuid}/authentication/import:
    put:
      tags:
      - Kubernetes
      summary: Import a full cluster authentication configuration
      description: Replaces the entire set of OIDC authentication issuer configurations for a cluster with the supplied native kube-apiserver v1 AuthenticationConfiguration YAML document. Issuers are named deterministically from their issuer URL host. The top-level `anonymous` field is not supported and any configuration that would drop data is rejected.
      operationId: importClusterAuthentication
      parameters:
      - $ref: '#/components/parameters/kubernetesUuid'
      requestBody:
        $ref: '#/components/requestBodies/kubernetesImportClusterAuthentication'
      responses:
        '200':
          $ref: '#/components/responses/kubernetesImportClusterAuthentication200'
        '400':
          $ref: '#/components/responses/kubernetesBadRequest'
        '401':
          $ref: '#/components/responses/kubernetesUnAuthorized'
        '404':
          $ref: '#/components/responses/kubernetesNotFound'
        default:
          $ref: '#/components/responses/kubernetesInternalServerError'
    servers:
    - url: https://api.upcloud.com
  /1.3/kubernetes/{uuid}/authentication/{name}:
    get:
      tags:
      - Kubernetes
      summary: Get a cluster authentication entry
      operationId: getClusterAuthentication
      parameters:
      - $ref: '#/components/parameters/kubernetesUuid'
      - $ref: '#/components/parameters/kubernetesName'
      responses:
        '200':
          $ref: '#/components/responses/kubernetesGetClusterAuthentication200'
        '401':
          $ref: '#/components/responses/kubernetesUnAuthorized'
        '404':
          $ref: '#/components/responses/kubernetesNotFound'
        default:
          $ref: '#/components/responses/kubernetesInternalServerError'
    put:
      tags:
      - Kubernetes
      summary: Update a cluster authentication entry
      description: Updates an existing OIDC authentication issuer configuration. The name in the path is authoritative. The updated entry is validated together with the cluster's other entries before being applied.
      operationId: updateClusterAuthentication
      parameters:
      - $ref: '#/components/parameters/kubernetesUuid'
      - $ref: '#/components/parameters/kubernetesName'
      requestBody:
        $ref: '#/components/requestBodies/kubernetesUpdateClusterAuthentication'
      responses:
        '200':
          $ref: '#/components/responses/kubernetesUpdateClusterAuthentication200'
        '400':
          $ref: '#/components/responses/kubernetesBadRequest'
        '401':
          $ref: '#/components/responses/kubernetesUnAuthorized'
        '404':
          $ref: '#/components/responses/kubernetesNotFound'
        default:
          $ref: '#/components/responses/kubernetesInternalServerError'
    delete:
      tags:
      - Kubernetes
      summary: Delete a cluster authentication entry
      description: Removes an OIDC authentication issuer configuration by name.
      operationId: deleteClusterAuthentication
      parameters:
      - $ref: '#/components/parameters/kubernetesUuid'
      - $ref: '#/components/parameters/kubernetesName'
      responses:
        '204':
          $ref: '#/components/responses/kubernetesDeleteClusterAuthentication204'
        '401':
          $ref: '#/components/responses/kubernetesUnAuthorized'
        '404':
          $ref: '#/components/responses/kubernetesNotFound'
        default:
          $ref: '#/components/responses/kubernetesInternalServerError'
    servers:
    - url: https://api.upcloud.com
  /1.3/kubernetes/{uuid}/authentication/{name}/kubeconfig:
    get:
      tags:
      - Kubernetes
      summary: Get OIDC kubeconfig
      description: Returns a kubeconfig for the cluster whose user authenticates via the kubelogin (`kubectl oidc-login`) exec credential plugin, using the cluster's configured OIDC issuer identified by the `name` path parameter. The plugin (kubelogin) must be installed on the client. No long-lived credential is embedded. The OIDC client secret and any provider-specific kubelogin flags are not injected by the server; the returned kubeconfig includes comments describing how to add them.
      operationId: getKubernetesClusterOIDCKubeconfig
      parameters:
      - $ref: '#/components/parameters/kubernetesUuid'
      - $ref: '#/components/parameters/kubernetesName'
      - $ref: '#/components/parameters/getKubernetesClusterOIDCKubeconfigAudience'
      responses:
        '200':
          $ref: '#/components/responses/kubernetesGetClusterKubeconfig'
        '400':
          $ref: '#/components/responses/kubernetesBadRequest'
        '401':
          $ref: '#/components/responses/kubernetesUnAuthorized'
        '404':
          $ref: '#/components/responses/kubernetesNotFound'
        default:
          $ref: '#/components/responses/kubernetesInternalServerError'
    servers:
    - url: https://api.upcloud.com
components:
  responses:
    kubernetesGetCluster:
      description: 200 getCluster response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/kubernetesCluster'
          example:
            control_plane_ip_filter:
            - 1.2.3.4/24
            - 1.1.1.1
            name: example-cluster
            network: 33333333-3333-3333-333333333333
            network_cidr: 172.16.0.0/24
            node_groups:
            - count: 4
              kubelet_args:
              - key: log-flush-frequency
                value: 5s
              labels:
              - key: managedBy
                value: exampleDevelopmentTeam
              - key: environment
                value: development
              name: small
              plan: K8S-2xCPU-4GB
              ssh_keys:
              - ssh-rsa 
              state: running
              storage: 01000000-0000-4000-8000-000160010100
              taints:
              - effect: NoSchedule
                key: environment
                value: development
            - count: 8
              kubelet_args:
              - key: log-flush-frequency
                value: 15s
              labels:
              - key: managedBy
                value: exampleStagingTeam
              - key: environment
                value: staging
              name: medium
              plan: K8S-4xCPU-8GB
              ssh_keys:
              - ssh-rsa 
              state: pending
              storage: 01000000-0000-4000-8000-000160010100
              taints:
              - effect: NoSchedule
                key: environment
                value: staging
            uuid: 11111111-1111-1111-1111-111111111111
            state: running
            zone: de-fra1
    kubernetesPostNodeGroup:
      description: 201 postNodeGroup response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/kubernetesNodeGroup'
          example:
            count: 4
            kubelet_args:
            - key: log-flush-frequency
              value: 5s
            labels:
            - key: managedBy
              value: exampleDevelopmentTeam
            - key: environment
              value: development
            name: small
            plan: K8S-2xCPU-4GB
            ssh_keys:
            - ssh-rsa 
            state: pending
            storage: 01000000-0000-4000-8000-000160010100
            taints:
            - effect: NoSchedule
              key: environment
              value: development
    kubernetesGetClusters:
      description: 200 getClusters response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/kubernetesClusters'
          example:
