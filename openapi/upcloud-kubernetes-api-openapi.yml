              kubelet_args:
              - key: log-flush-frequency
                value: 5s
              labels:
              - key: managedBy
                value: exampleDevelopmentTeam
              - key: environment
                value: development
              name: small
              plan: K8S-2xCPU-4GB
              ssh_keys:
              - ssh-rsa 
              state: running
              storage: 01000000-0000-4000-8000-000160010100
              taints:
              - effect: NoSchedule
                key: environment
                value: development
            - count: 8
              kubelet_args:
              - key: log-flush-frequency
                value: 15s
              labels:
              - key: managedBy
                value: exampleStagingTeam
              - key: environment
                value: staging
              name: medium
              plan: K8S-4xCPU-8GB
              ssh_keys:
              - ssh-rsa 
              state: pending
              storage: 01000000-0000-4000-8000-000160010100
              taints:
              - effect: NoSchedule
                key: environment
                value: staging
            uuid: 11111111-1111-1111-1111-111111111111
            state: running
            zone: de-fra1
          - name: another-example-cluster
            network: another33333333-3333-3333-333333333333
            network_cidr: 172.16.0.0/24
            node_groups:
            - count: 4
              name: large
              plan: K8S-8xCPU-32GB
              ssh_keys:
              - ssh-rsa 
              state: running
              storage: 01000000-0000-4000-8000-000160010100
            uuid: 22222222-2222-2222-2222-222222222222
            state: pending
            zone: de-fra1
    kubernetesCreateClusterAuthentication201:
      description: Authentication entry created.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/kubernetesAuthenticationIssuerConfig'
    kubernetesPostCluster:
      description: 201 postCluster response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/kubernetesCluster'
          example:
            control_plane_ip_filter:
            - 1.2.3.0/24
            - 1.1.1.1
            name: example-cluster
            network: 33333333-3333-3333-333333333333
            network_cidr: 172.16.0.0/24
            node_groups:
            - count: 4
              kubelet_args:
              - key: log-flush-frequency
                value: 5s
              labels:
              - key: managedBy
                value: exampleDevelopmentTeam
              - key: environment
