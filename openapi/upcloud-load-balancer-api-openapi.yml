          example: manual
        hostnames:
          type: array
          items:
            type: string
            format: domainname-allow-wildcard
          maxItems: 100
          minItems: 1
          description: Array of hostnames
        certificate:
          type:
          - string
          - 'null'
          format: certificate
          description: Certificate
          contentEncoding: base64
        intermediates:
          type:
          - string
          - 'null'
          format: multiple-certificates
          description: Intermediate certificates
          contentEncoding: base64
        private_key:
          type:
          - string
          - 'null'
          format: private-key
          description: Private key
          contentEncoding: base64
        challenge_key:
          type: string
          maxLength: 64
          minLength: 1
