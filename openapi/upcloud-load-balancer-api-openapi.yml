        updated_at:
          type: string
          examples:
          - '2025-11-06T09:30:00.000Z'
          format: date-time
          description: Timestamp when the network was last updated (RFC 3339 format).
      title: Network
      required:
      - name
      - uuid
      - type
      - family
      - created_at
      - updated_at
      additionalProperties: false
      description: Represent a network from where traffic is consumed and routed.
