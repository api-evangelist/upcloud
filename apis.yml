- aid: upcloud:upcloud-plan-api
  name: UpCloud Plan API
  description: >-
    Plans are preconfigured server configurations with fixed price. Each plan includes certain number
    of CPU cores, memory amount, storage and transfer quota. Most plans also include one public IPv4 address.
    Utility IPv4 addresses and public IPv6 addresses are currently free of charge, so they are not included
    in plan.


    In addition to plans available in a zone, there is always possibility for free scaling of CPU, memory
    and disk resources. In such cases the plan used by server will be reported as "custom" by API. It
    is possible to change existing "custom" server to a fixed plan provided that CPU cores and memory
    amount matches the selected plan.


    GPU plans also have additional `gpu_amount` and `gpu_model` attributes, which indicate the number
    of GPUs and their model included in the plan.


    If server's storage or network resources do not fit to plan's specification, they are billed on an
    hourly basis. The storage device(s) and IP addresses included in fixed plan price have `part_of_plan`
    attribute with value "yes" in server details response.
  humanURL: https://developers.upcloud.com/api/1.3
  baseURL: https://api.upcloud.com
  tags:
  - Plan
  tags_raw:
  - plan
  properties:
  - type: OpenAPI
    url: openapi/upcloud-plan-api-openapi.yml
  - type: Documentation
    url: https://developers.upcloud.com/api/1.3
