- aid: upcloud:upcloud-load-balancer-api
  name: UpCloud Load Balancer API
  description: >-
    A Managed load balancer works as the network level frontend of customer application by directing connections
    to the backend servers.


    The Managed load balancer API allows customer to manage their services. Managed load balancers are
    available in every UpCloud zone. The API requests and responses payload are in JSON format only.


    API follows JSON Merge Patch semantics. Note when modifying nested structures payload should contain
    entire array, which in a sense is PUT within PATCH for them. JSON Merge Patch uses null to explicitly
    indicate property deletion while absent properties are ignored, i.e. not modified.


    It is recommended to use the hostnames of your load balancer when directing your domain to it. This
    ensures utilization of all addresses that the load balancer might possess.


    For the subdomains of your domain, use CNAME. For the primary domain, you might need to use ALIAS,
    or whatever is supported by your DNS provider.
