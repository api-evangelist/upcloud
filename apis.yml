- aid: upcloud:upcloud-object-storage-2-api
  name: UpCloud Object Storage 2 API
  description: >-
    Object Storage is a computer data storage architecture that manages data as objects as opposed to
    block storage which manages data as blocks within sectors and tracks. Managed Object storage is commonly
    used to manage large amounts of unstructured data for example storing large datasets like photos,
    music, or files in online collaboration services. All customers data is encrypted by default using
    encryption at rest.


    Managed Object Storage API commands allow creation, management and deletion of Object Storage devices
    as well as viewing Object Storage network data usage. Managed Object Storage is fully S3-compliant
    allowing file and bucket management using existing S3 clients.


    API follows JSON Merge Patch semantics. Note when modifying nested structures payload should contain
    entire array, which in a sense is PUT within PATCH for them. JSON Merge Patch uses null to explicitly
    indicate property deletion while absent properties are ignored, i.e. not modified.
