aid: upcloud
name: UpCloud
description: UpCloud is a Finnish cloud infrastructure provider offering cloud servers,
  block and object storage, managed databases, managed Kubernetes (UKS), load balancers
  and private networking from data centres in Europe, North America, Asia and Australia.
  Its public REST API (version 1.3, api.upcloud.com) is documented at developers.upcloud.com
  with a published OpenAPI 3.1 contract, and is backed by official Go, Python and
  PHP clients, the upctl CLI and a Terraform provider.
