- aid: upcloud:upcloud-storage-api
  name: UpCloud Storage API
  description: >-
    Block Storage is similar to a physical hard disk. It can be used to install an operating system or
    hold another filesystem for a Cloud Server.


    Writable Block Storage and CD-ROM resources can be freely attached to any Cloud Server within the
    same zone and under the same account. A maximum of 16 storage devices can be attached to a Cloud Server
    at the same time; however, the combined limit for network interfaces and storage devices is 24.


    <h3>Storage resource types</h3>


    There are four different storage resource types: normal, CD-ROM, template, and backup. The normal
    type represents writable Block Storage.
  humanURL: https://developers.upcloud.com/api/1.3
  baseURL: https://api.upcloud.com
