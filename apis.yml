- aid: upcloud:upcloud-ip-address-api
  name: UpCloud Ip Address API
  description: "The UpCloud network has public and private IP addresses.\n\nPublic IP addresses are used\
    \ to connect to the server from the Internet.\n\nPrivate Utility network addresses are available for\
    \ all servers within a\nsingle account, and can communicate with each other globally as long\nas the\
    \ servers have the utility network interfaces configured. This is\nadded to servers by default.\n\n\
    A server has a minimum of zero and a maximum of five public IPv4 and IPv6\naddresses. Every server\
    \ can have one utility network IPv4 address only,\nand must have at least one IP address. The UpCloud\
    \ API assigns the IP addresses\nautomatically in networks configured to use DHCP. IP addresses cannot\
    \ be\nreserved for later use, except for floating IPs that can be reserved and\nswitched from server\
    \ to another freely within their specific zone.\n\nThe operating system running on the server will\
    \ see a separate network interface\nper IP address. On a typical server, there are three network interfaces.\
    \ The\nfirst network interface is assigned to the public network and the second to the\nUtility network.\
    \ If the server has an IPv6 address configured it will use the\nthird network interface. DHCP service\
    \ is provided on all public IPv4 network\ninterfaces and all private DHCP-enabled networks for automatic\
    \ configuration\nof the correct IP address. IPv6 network interfaces should use stateless\naddress\
    \ autoconfiguration (SLAAC) with IPv6 privacy extensions disabled.\nOn IPv6-only server DNS parameters\
    \ can be obtained with stateless DHCPv6.\n\nAdditionally, there are floating IPs: IPv4 addresses that\
    \ can be\nattached to any IPv4 interface in their specific zone (eg. de-fra1 or fi-hel2).\nFloating\
    \ IP addresses can be instantly switched from one server to another when\ndoing maintenance or dealing\
    \ with technical issues. More information on floating\nIPs and their configuration can be found from\
    \ [our tutorials](https://upcloud.com/community/tutorials/floating-ip-addresses/).\n\n## Release policy\n\
    \nThe release policy defines what happens to an IP address when its dependent resource is deleted,\
    \ such as a server or service it's attached to. The following values are supported:\n\n`release`:\
    \ The address is also deleted. This applies to both normal and floating IP addresses.\n\n`keep`: For\
    \ normal (non-floating) IP addresses, they are converted to detached floating IPs when their dependent\
    \ resource is deleted. For floating IP addresses, they remain as detached floating IPs that can be\
    \ reattached elsewhere.\n\nFloating IP addresses are created with `keep` as default policy, ensuring\
    \ they remain available even after dependency deletion.\n\nThe release policy can be set when creating\
    \ a new IP address or modified for an existing one through the API.\n\nNote that release policy functionality\
    \ is currently only supported for public IPv4 addresses.\n\n## Service delegation\n\nAssign existing\
    \ Floating IPv4 addresses to a service instead of a server. This enables the service to manage the\
    \ IP address and use your dedicated floating IP address in the service's DNS records.\n\nDelegated\
    \ IP addresses can be tracked with the `is_delegated` attribute in the API response.\n\nWhen an IP\
    \ address is delegated to a service, it becomes subject to specific access restrictions. The IP address\
    \ becomes managed by the service until you explicitly remove it. During the delegation:  \n\n* You\
    \ cannot delete the IP address.\n* You cannot modify its MAC address.\n* You can only update the release\
    \ policy and PTR record.\n\nThese restrictions ensure service stability and are automatically lifted\
    \ once the IP address is removed from the service and as long as the release policy is set to `keep`\
    \ so the IP address remains available in your account.\n\nCurrently only Load Balancer supports IP\
    \ address delegation."
  humanURL: https://developers.upcloud.com/api/1.3
  baseURL: https://api.upcloud.com
  tags:
  - IP Address
  tags_raw:
  - ip_address
  properties:
  - type: OpenAPI
    url: openapi/upcloud-ip-address-api-openapi.yml
  - type: Documentation
    url: https://developers.upcloud.com/api/1.3
